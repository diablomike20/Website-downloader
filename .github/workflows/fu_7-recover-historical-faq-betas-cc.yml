name: FU_7 Recover Historical Cudy FAQ Betas via CommonCrawl

on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - ".github/workflows/fu_7-recover-historical-faq-betas-cc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Recover historical beta hrefs from raw Cudy FAQ captures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered evidence
          python3 - <<'PY'
          import gzip,io,json,os,re,hashlib,urllib.parse,urllib.request
          UA="Mozilla/5.0 OpenCudy-FU7-Historical-Beta-CC"
          targets=[
            {
             "tag":"LT450-R9-beta",
             "pages":[
              "https://www.cudy.com/blogs/faq/beta-firmware-fix-lt18-lt450-lt500-lt500d-and-t-mobile-configuration-issue",
              "https://www.cudy.com/blogs/faq/beta-firmware-fix-lt18-lt450-lt500-lt500d-and-t-mobile-configuration-issue?page=1"
             ],
             "needle":"LT450-R9-1.15.5beta-20221121-180014-flash.bin"
            },
            {
             "tag":"LT500-R9-beta",
             "pages":[
              "https://www.cudy.com/blogs/faq/beta-firmware-fix-lt18-lt450-lt500-lt500d-and-t-mobile-configuration-issue",
              "https://www.cudy.com/blogs/faq/beta-firmware-fix-lt18-lt450-lt500-lt500d-and-t-mobile-configuration-issue?page=1"
             ],
             "needle":"LT500-R9-1.15.5beta-20221121-180014-flash.bin"
            },
            {
             "tag":"P5-R21-beta",
             "pages":[
              "https://www.cudy.com/blogs/faq/how-to-fix-t-mobile-wi-fi-calling-issues-on-p5",
              "https://www.cudy.com/en-me/blogs/faq/how-to-fix-t-mobile-wi-fi-calling-issues-on-p5"
             ],
             "needle":"P5-R21-1.15.15-20230616-112055-sysupgrade"
            }
          ]
          def get(url,timeout=70,headers=None):
              h={"User-Agent":UA,"Accept":"*/*"}
              if headers:h.update(headers)
              req=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.read(),r.status,dict(r.headers)
          coll=json.loads(get("https://index.commoncrawl.org/collinfo.json",40)[0].decode())
          indexes=[x["id"] for x in coll if x["id"].startswith(("CC-MAIN-2023-","CC-MAIN-2024-","CC-MAIN-2025-","CC-MAIN-2026-"))]
          links=[]; evidence=[]

          def add(tag,url,source):
              if not url:return
              url=url.replace("&amp;","&").replace("\\u0026","&")
              if url.startswith("//"):url="https:"+url
              if not any(x["tag"]==tag and x["url"]==url for x in links):
                  links.append({"tag":tag,"url":url,"source":source})

          for t in targets:
              for page in t["pages"]:
                  records=[]
                  for idx in indexes:
                      for variant in [page,page.replace("https://www.cudy.com","http://www.cudy.com"),page.replace("www.cudy.com","cudy.com")]:
                          q=urllib.parse.urlencode({"url":variant,"output":"json"})
                          try:b,_,_=get(f"https://index.commoncrawl.org/{idx}-index?{q}",25)
                          except:continue
                          for ln in b.decode("utf-8","replace").splitlines():
                              try:o=json.loads(ln)
                              except:continue
                              if o.get("status")=="200" and o.get("filename") and o.get("offset") and o.get("length"):
                                  o["_idx"]=idx;records.append(o)
                  uniq={(o["filename"],o["offset"],o["length"]):o for o in records}
                  print(t["tag"],page,"RECORDS",len(uniq))
                  for ri,o in enumerate(uniq.values(),1):
                      start=int(o["offset"]);end=start+int(o["length"])-1
                      try:b,_,_=get("https://data.commoncrawl.org/"+o["filename"],70,{"Range":f"bytes={start}-{end}"})
                      except:continue
                      try:raw=gzip.decompress(b)
                      except:
                          try:raw=gzip.GzipFile(fileobj=io.BytesIO(b)).read()
                          except:raw=b
                      txt=raw.decode("utf-8","replace"); low=txt.lower()
                      if t["needle"].lower() not in low:continue
                      pos=low.find(t["needle"].lower())
                      frag=txt[max(0,pos-12000):pos+16000]
                      ep=f"evidence/{t['tag']}-{o['_idx']}-{ri}.html"
                      open(ep,"w",encoding="utf-8").write(frag)
                      for m in re.finditer(r'(?i)href=["\']([^"\']+)["\']',frag):
                          href=urllib.parse.urljoin(page,urllib.parse.unquote(m.group(1)))
                          # prioritize exact-near anchors, firmware links, cdn/drive links
                          if (t["needle"].lower() in href.lower()
                              or href.lower().endswith((".bin",".zip"))
                              or "drive.google" in href.lower()
                              or "/download" in href.lower()
                              or "cdn." in href.lower()):
                              add(t["tag"],href,f"CC:{o['_idx']}")
                      # raw URL strings around marker
                      for m in re.finditer(r'(?i)https?://[^"\'<>\s]+',frag):
                          u=urllib.parse.unquote(m.group(0))
                          if (t["needle"].lower() in u.lower()
                              or u.lower().endswith((".bin",".zip"))
                              or "drive.google" in u.lower()
                              or "cdn." in u.lower()):
                              add(t["tag"],u,f"CC_RAW:{o['_idx']}")
                      evidence.append({"tag":t["tag"],"page":page,"index":o["_idx"],"digest":o.get("digest"),"file":ep})

          # explicit current likely aliases for exact known names
          known={
            "LT450-R9-beta":"LT450-R9-1.15.5beta-20221121-180014-flash.bin",
            "LT500-R9-beta":"LT500-R9-1.15.5beta-20221121-180014-flash.bin",
          }
          for tag,fn in known.items():
              for base in [
                "https://www.cudy.com/cdn/shop/files/",
                "https://cdn.shopify.com/s/files/1/0673/4748/0820/files/",
                "https://www.cudytech.com/wp-content/uploads/",
              ]:
                  add(tag,base+fn,"KNOWN_ALIAS")

          # Expand drive and archived direct URLs, then download.
          for x in list(links):
              u=x["url"]
              if "drive.google.com" in u:
                  m=re.search(r'/file/d/([^/]+)',u) or re.search(r'[?&]id=([^&]+)',u)
                  if m:
                      fid=m.group(1)
                      add(x["tag"],f"https://drive.usercontent.google.com/download?id={fid}&export=download&confirm=t","DRIVE_DIRECT:"+x["source"])

          results=[]
          for x in links:
              u=x["url"]
              try:
                  data,st,h=get(u,120);sha=hashlib.sha256(data).hexdigest()
                  htmlish=b"<html" in data[:1500].lower() or b"<!doctype" in data[:1500].lower()
                  rec={**x,"status":st,"size":len(data),"sha256":sha,"type":h.get("Content-Type",""),"htmlish":htmlish}
                  if len(data)>1_000_000 and not htmlish:
                      cd=h.get("Content-Disposition","");name=""
                      mm=re.search(r'filename\*?=(?:UTF-8\'\')?["\']?([^;"\']+)',cd,re.I)
                      if mm:name=urllib.parse.unquote(mm.group(1).strip())
                      if not name:name=urllib.parse.unquote(urllib.parse.urlsplit(u).path.rsplit("/",1)[-1])
                      if not name or "." not in name:name=x["tag"]+"-"+sha[:8]+".bin"
                      name=re.sub(r'[^A-Za-z0-9._()+ -]+','_',name)
                      out="recovered/"+name
                      if os.path.exists(out):out="recovered/"+sha[:8]+"-"+name
                      open(out,"wb").write(data);rec["saved_as"]=out
                      print("SAVED",x["tag"],out,len(data),sha,u)
                  results.append(rec)
              except Exception as e:results.append({**x,"error":repr(e)})
          json.dump({"links":links,"results":results,"evidence":evidence},open("fu_7-HISTORICAL-FAQ-BETA-CC.json","w"),indent=2,ensure_ascii=False)
          print(json.dumps({"links":len(links),"saved":[x for x in results if x.get("saved_as")]},indent=2,ensure_ascii=False))
          PY
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fu_7-HISTORICAL-FAQ-BETA-CC
          retention-days: 30
          if-no-files-found: warn
          path: |
            recovered/*
            fu_7-HISTORICAL-FAQ-BETA-CC.json
            evidence/*
