name: FU_7 Download R700 WAN VLAN Beta Correct ID

on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - ".github/workflows/fu_7-download-r700-wan-vlan-beta-correct.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download exact R700 beta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered
          python3 -m pip install --quiet gdown
          gdown --fuzzy             'https://drive.google.com/file/d/12Y3ktMv9MnyD8ezzwi4kkSvNBUMvZA3/view?usp=sharing'             -O recovered/R700-WAN-VLAN-beta-drive-download || true

          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          rows=[]
          for p in sorted(Path("recovered").glob("*")):
              if not p.is_file():continue
              data=p.read_bytes()
              htmlish=b"<html" in data[:2000].lower() or b"<!doctype" in data[:2000].lower()
              if len(data)<100000 or htmlish:
                  print("REJECT",p.name,len(data),htmlish);p.unlink();continue
              sha=hashlib.sha256(data).hexdigest()
              rows.append({"filename":p.name,"size":len(data),"sha256":sha})
              print("SAVED",p.name,len(data),sha)
          Path("fu_7-R700-WAN-VLAN-BETA-MANIFEST.json").write_text(json.dumps(rows,indent=2),encoding="utf-8")
          PY

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fu_7-R700-WAN-VLAN-BETA
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
          path: |
            recovered/*
            fu_7-R700-WAN-VLAN-BETA-MANIFEST.json
