name: FU_7 C200P 2.5.14 vs 2.5.15 Internal Delta
on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - ".github/workflows/fu_7-c200p-2514-vs-2515.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FW_14: "https://www.cudy.com/cdn/shop/files/C200P-R74-2.5.14-20260618-150931-flash.zip"
      FW_15: "https://www.cudy.com/cdn/shop/files/C200P-R74-2.5.15-20260629-160214-flash.zip"
    steps:
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools file >/dev/null
      - name: Compare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v14 v15 out
          for v in 14 15; do
            eval url="\$FW_$v"
            curl -L --fail --retry 3 "$url" -o "v$v/fw.zip"
            unzip -q "v$v/fw.zip" -d "v$v/unzip"
            bin="$(find "v$v/unzip" -type f -name '*.bin' | head -1)"
            sha256sum "v$v/fw.zip" "$bin" > "v$v/hashes.txt"
            python3 - "$bin" "v$v/rootfs.sqfs" <<'PY'
          from pathlib import Path
          import sys
          d=Path(sys.argv[1]).read_bytes(); off=d.find(b"hsqs")
          if off<0: raise SystemExit("no sqfs")
          Path(sys.argv[2]).write_bytes(d[off:])
          PY
            unsquashfs -no-exit-code -d "v$v/rootfs" "v$v/rootfs.sqfs" >/dev/null
          done

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          A=Path("v14/rootfs"); B=Path("v15/rootfs")
          def tree(root):
              d={}
              for p in root.rglob("*"):
                  if p.is_file():
                      rel=str(p.relative_to(root))
                      h=hashlib.sha256(p.read_bytes()).hexdigest()
                      d[rel]=(p.stat().st_size,h)
              return d
          a=tree(A); b=tree(B)
          out={
            "only_2.5.14":sorted(set(a)-set(b)),
            "only_2.5.15":sorted(set(b)-set(a)),
            "changed":sorted(k for k in set(a)&set(b) if a[k]!=b[k])
          }
          Path("out/full-diff.json").write_text(json.dumps(out,indent=2))
          focus=[
            "etc/rom_release","etc/rom_develop","etc/init.d/dropbear","etc/init.d/telnet",
            "usr/lib/lua/luci/controller/ssh.lua","usr/lib/lua/luci/model/cbi/ssh/ssh.lua",
            "usr/lib/lua/luci/controller/system.lua","usr/lib/lua/luci/model/cbi/system/terminal.lua",
            "usr/lib/lua/luci/model/cbi/system/sandbox.lua","usr/lib/lua/luci/forbidden.lua",
            "usr/lib/lua/luci/description.lua","usr/lib/lua/luci/gui.lua",
            "usr/lib/lua/cmagent.lua","usr/lib/lua/cmagent/router/ssh.lua",
            "usr/lib/lua/cmagent/router/batchcmd.lua","usr/lib/lua/cmagent/router/tcpdump.lua",
            "usr/lib/lua/cmagent/router/diag.lua","usr/sbin/mesh_tcpdump.sh","usr/sbin/mesh_diag.sh",
            "usr/lib/lua/luci/model/cbi/tools/tcpdump.lua"
          ]
          rows=[]
          for rel in focus:
              row={"path":rel}
              for tag,root,d in [("2.5.14",A,a),("2.5.15",B,b)]:
                  if rel in d:
                      row[tag]={"size":d[rel][0],"sha256":d[rel][1]}
                  else: row[tag]=None
              row["same"]=row["2.5.14"]==row["2.5.15"]
              rows.append(row)
          Path("out/focus.json").write_text(json.dumps(rows,indent=2))
          with open("out/focus.tsv","w") as f:
              f.write("path\t2.5.14\t2.5.15\tsame\n")
              for r in rows:
                  f.write(f"{r['path']}\t{r['2.5.14']}\t{r['2.5.15']}\t{r['same']}\n")
          print("ONLY14",len(out["only_2.5.14"]),"ONLY15",len(out["only_2.5.15"]),"CHANGED",len(out["changed"]))
          PY

          {
            echo '===== HASHES ====='
            cat v14/hashes.txt
            cat v15/hashes.txt
            echo
            echo '===== FOCUS ====='
            cat out/focus.tsv
            echo
            echo '===== INTERNAL ONLY 2.5.14 ====='
            python3 - <<'PY'
          import json,re
          d=json.load(open("out/full-diff.json"))
          rx=re.compile(r'(ssh|batchcmd|tcpdump|diag|terminal|sandbox|debug|factory|develop|rom_|cmagent|mesh|cloud|forbidden)',re.I)
          for x in d["only_2.5.14"]:
              if rx.search(x): print(x)
          PY
            echo
            echo '===== INTERNAL ONLY 2.5.15 ====='
            python3 - <<'PY'
          import json,re
          d=json.load(open("out/full-diff.json"))
          rx=re.compile(r'(ssh|batchcmd|tcpdump|diag|terminal|sandbox|debug|factory|develop|rom_|cmagent|mesh|cloud|forbidden)',re.I)
          for x in d["only_2.5.15"]:
              if rx.search(x): print(x)
          PY
          } > out/fu_7-C200P-2514-vs-2515.txt

          cat out/fu_7-C200P-2514-vs-2515.txt
          zip -qr fu_7-C200P-2514-vs-2515.zip out
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fu_7-C200P-2514-vs-2515
          retention-days: 30
          if-no-files-found: error
          path: |
            fu_7-C200P-2514-vs-2515.zip
            out/fu_7-C200P-2514-vs-2515.txt
            out/focus.json
            out/full-diff.json
