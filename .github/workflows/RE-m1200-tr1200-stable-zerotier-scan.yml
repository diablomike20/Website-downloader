name: RE M1200 TR1200 Stable ZeroTier Scan
on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - ".github/workflows/RE-m1200-tr1200-stable-zerotier-scan.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: fu_7-cudy-cdn-index }
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools binutils unzip >/dev/null
      - shell: bash
        run: |
          set -euxo pipefail
          rm -rf RE-M1200-TR1200-STABLE-ZT
          mkdir -p RE-M1200-TR1200-STABLE-ZT
          python3 - <<'PY'
          import json,hashlib,os,re,subprocess,urllib.request,zipfile
          from pathlib import Path

          out=Path("RE-M1200-TR1200-STABLE-ZT")
          targets=[
            ("M1200-R22-2.0.8","https://www.cudy.com/cdn/shop/files/M1200-R22-2.0.8-20240306-170059-flash.zip"),
            ("M1200-R22-2.4.19","https://www.cudy.com/cdn/shop/files/M1200-R22-2.4.19-20250826-164643-flash.zip"),
            ("M1200-R22-2.4.24","https://www.cudy.com/cdn/shop/files/M1200-R22-2.4.24-20260105-103138-flash.zip"),
            ("TR1200-R46-1.16.3","https://www.cudy.com/cdn/shop/files/TR1200-R46-1.16.3-20230804-164635-flash.zip"),
            ("TR1200-R46-2.1.3","https://www.cudy.com/cdn/shop/files/TR1200-R46-2.1.3-20240428-102143-flash.zip"),
            ("TR1200-R46-2.2.7","https://www.cudy.com/cdn/shop/files/TR1200-R46-2.2.7-20241011-103924-flash.zip"),
            ("TR1200-R46-2.3.7","https://www.cudy.com/cdn/shop/files/TR1200-R46-2.3.7-20250113-115854-flash.zip"),
            ("TR1200-R46-2.4.15","https://www.cudy.com/cdn/shop/files/TR1200-R46-2.4.15-20250721-164017-flash.zip"),
            ("TR1200-R46-2.5.25","https://www.cudy.com/cdn/shop/files/TR1200-R46-2.5.25-20260805-112208-flash.zip"),
          ]
          base={"libc.so","libgcc_s.so.1","ld-musl-mipsel-sf.so.1","ld-musl-mipsel.so.1"}
          def get(u):
            req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0 OpenCudy-RE","Accept":"*/*"})
            with urllib.request.urlopen(req,timeout=120) as r:return r.read()
          def sha(b):return hashlib.sha256(b).hexdigest()
          def run(c):
            return subprocess.run(c,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=180).stdout
          def findlib(root,n):
            for p in root.rglob(n):
              if p.exists():return p
            pref=n.split(".so")[0]+".so"
            for p in root.rglob(pref+"*"):
              if p.exists():return p
          def size(p):
            try:
              if p.is_symlink():
                q=(p.parent/os.readlink(p)).resolve()
                return q.stat().st_size if q.exists() else 0
              return p.stat().st_size
            except:return 0
          rows=[]
          for idx,(tag,u) in enumerate(targets):
            rec={"tag":tag,"url":u,"status":"UNKNOWN","firmwares":[]}
            try:b=get(u)
            except Exception as e:
              rec["status"]="DOWNLOAD_FAIL";rec["error"]=repr(e);rows.append(rec);continue
            rec["zip_size"]=len(b);rec["zip_sha256"]=sha(b)
            zp=out/f"{idx}.zip";zp.write_bytes(b)
            d=out/f"d{idx}";d.mkdir()
            try:
              with zipfile.ZipFile(zp) as z:z.extractall(d)
            except Exception as e:
              rec["status"]="ZIP_FAIL";rec["error"]=repr(e);rows.append(rec);continue
            for fw in d.rglob("*"):
              if not fw.is_file() or fw.suffix.lower()!=".bin":continue
              dat=fw.read_bytes();off=dat.find(b"hsqs")
              if off<0:continue
              sq=out/f"{idx}-{fw.name}.sqfs";sq.write_bytes(dat[off:])
              root=out/f"root{idx}-{fw.stem}"
              run(["unsquashfs","-no-progress","-d",str(root),str(sq)])
              release=""
              for p in [root/"etc/openwrt_release",root/"etc/openwrt_version",root/"etc/rom_version"]:
                if p.exists():release+=p.read_text(errors="ignore").strip()+" | "
              zts=[p for p in root.rglob("zerotier-one") if p.is_file()]
              zi=[]
              for zt in zts:
                bb=zt.read_bytes();dyn=run(["readelf","-d",str(zt)])
                needed=re.findall(r"Shared library: \\[(.*?)\\]",dyn)
                libs=[];extra=0
                for n in needed:
                  p=findlib(root,n);sz=size(p) if p else 0
                  bp=n in base
                  libs.append({"name":n,"size":sz,"path":str(p.relative_to(root)) if p else "MISSING","R26_base":bp})
                  if not bp:extra+=sz
                zi.append({"size":len(bb),"sha256":sha(bb),"needed":needed,"libs":libs,
                           "extra_dependency_bytes":extra,"estimated_R26_payload":len(bb)+extra,
                           "saving_vs_R25":2140557-(len(bb)+extra)})
              rec["firmwares"].append({"name":fw.name,"size":len(dat),"sha256":sha(dat),
                                       "squashfs_offset":hex(off),"release":release,"zerotier":zi})
            rec["status"]="OK"
            rows.append(rec)
          (out/"RE-M1200-TR1200-STABLE-ZEROTIER-SCAN.json").write_text(json.dumps(rows,indent=2))
          md=["# M1200 + TR1200 stable ZeroTier scan","",
              "Only public normal Cudy releases; no beta/dev/support-private images.",""]
          for r in rows:
            md.append(f"## {r['tag']} — {r['status']}")
            if r["status"]!="OK":
              md.append(f"- {r.get('error','')}");continue
            for fw in r["firmwares"]:
              md.append(f"- Firmware: \`{fw['name']}\`")
              if not fw["zerotier"]:
                md.append("- zerotier-one: **ABSENT**")
              for z in fw["zerotier"]:
                md.append(f"- zerotier-one: **{z['size']} B**, payload ≈ **{z['estimated_R26_payload']} B**, saving **{z['saving_vs_R25']} B**")
                md.append(f"- SHA256: \`{z['sha256']}\`")
                md.append(f"- NEEDED: {', '.join(z['needed'])}")
          (out/"RE-M1200-TR1200-STABLE-ZEROTIER-SCAN.md").write_text("\n".join(md)+"\n")
          print("\n".join(md))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RE-M1200-TR1200-STABLE-ZEROTIER-SCAN
          retention-days: 30
          path: |
            RE-M1200-TR1200-STABLE-ZT/RE-M1200-TR1200-STABLE-ZEROTIER-SCAN.*
      - shell: bash
        run: |
          mkdir -p RE-M1200-TR1200-STABLE-ZT-LATEST
          cp RE-M1200-TR1200-STABLE-ZT/RE-M1200-TR1200-STABLE-ZEROTIER-SCAN.* RE-M1200-TR1200-STABLE-ZT-LATEST/
          git config user.name "OpenCudy RE Bot"
          git config user.email "73985391+diablomike20@users.noreply.github.com"
          git add RE-M1200-TR1200-STABLE-ZT-LATEST
          git diff --cached --quiet && exit 0
          git commit -m "RE: publish M1200 TR1200 stable ZeroTier scan"
          git push origin HEAD:fu_7-cudy-cdn-index
