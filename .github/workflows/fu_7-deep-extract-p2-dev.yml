name: FU_7 Deep Extract P2 Dev Packages
on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - ".github/workflows/fu_7-deep-extract-p2-dev.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download previously collected P2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          mkdir -p previous
          gh run download 36638903516             --repo "${{ github.repository }}"             --name fu_7-CUDYFORUM-P2-DEV             --dir previous
          find previous -maxdepth 2 -type f -printf '%p %s bytes\n'

      - name: Unpack prior artifact and recursively extract nested packages
        shell: bash
        run: |
          set -e
          sudo apt-get update >/dev/null
          sudo apt-get install -y p7zip-full >/dev/null
          mkdir -p fu_7-P2-DEEP/input fu_7-P2-DEEP/extracted

          # The prior artifact contains the collection ZIP plus manifests.
          find previous -maxdepth 2 -type f -name '*.zip' -print0 | while IFS= read -r -d '' z; do
            unzip -o "$z" -d fu_7-P2-DEEP/input >/dev/null || true
          done

          python3 - <<'PY'
          import os,zipfile,tarfile,hashlib,csv,json,subprocess,shutil
          root="fu_7-P2-DEEP"
          inp=os.path.join(root,"input")
          ext=os.path.join(root,"extracted")
          queue=[]
          for dp,_,fs in os.walk(inp):
              for fn in fs:
                  p=os.path.join(dp,fn)
                  if fn.lower().endswith((".zip",".7z",".tar",".tgz",".tar.gz")):
                      queue.append(p)

          seen=set()
          while queue:
              src=queue.pop(0)
              key=os.path.abspath(src)
              if key in seen: continue
              seen.add(key)
              rel=os.path.relpath(src,inp).replace(os.sep,"__")
              dst=os.path.join(ext,rel+"_contents")
              os.makedirs(dst,exist_ok=True)
              ok=False
              try:
                  if zipfile.is_zipfile(src):
                      with zipfile.ZipFile(src) as z:z.extractall(dst)
                      ok=True
                  elif tarfile.is_tarfile(src):
                      with tarfile.open(src) as t:t.extractall(dst)
                      ok=True
              except Exception as e:
                  print("PY_EXTRACT_FAIL",src,repr(e))
              if not ok:
                  cp=subprocess.run(["7z","x","-y",f"-o{dst}",src],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
                  ok=(cp.returncode==0)
                  if not ok: print("7Z_FAIL",src,cp.stdout[-1000:])
              if ok:
                  for dp,_,fs in os.walk(dst):
                      for fn in fs:
                          p=os.path.join(dp,fn)
                          if fn.lower().endswith((".zip",".7z",".tar",".tgz",".tar.gz")):
                              queue.append(p)

          rows=[]
          for dp,_,fs in os.walk(root):
              for fn in fs:
                  p=os.path.join(dp,fn)
                  h=hashlib.sha256()
                  with open(p,"rb") as f:
                      for b in iter(lambda:f.read(1024*1024),b""):h.update(b)
                  rows.append({
                      "path":os.path.relpath(p,root),
                      "size":os.path.getsize(p),
                      "sha256":h.hexdigest(),
                      "firmware_like":"YES" if fn.lower().endswith((".bin",".img",".trx",".itb",".zip")) else "NO"
                  })
          rows.sort(key=lambda x:x["path"].lower())
          with open("fu_7-P2-DEEP-MANIFEST.csv","w",newline="",encoding="utf-8") as f:
              w=csv.DictWriter(f,fieldnames=["path","size","sha256","firmware_like"]);w.writeheader();w.writerows(rows)
          json.dump(rows,open("fu_7-P2-DEEP-MANIFEST.json","w"),indent=2)
          fw=[r for r in rows if r["firmware_like"]=="YES"]
          print(json.dumps({"files":len(rows),"firmware_like":len(fw),"firmwares":fw},indent=2,ensure_ascii=False))
          PY

      - name: Pack deep collection
        run: |
          zip -r -9 fu_7-P2-DEEP-COLLECTION.zip fu_7-P2-DEEP fu_7-P2-DEEP-MANIFEST.csv fu_7-P2-DEEP-MANIFEST.json

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fu_7-P2-DEEP-COLLECTION
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            fu_7-P2-DEEP-COLLECTION.zip
            fu_7-P2-DEEP-MANIFEST.csv
            fu_7-P2-DEEP-MANIFEST.json
