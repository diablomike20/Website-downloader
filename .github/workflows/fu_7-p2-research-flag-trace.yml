name: FU_7 P2 Research Flag Trace
on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - ".github/workflows/fu_7-p2-research-flag-trace.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_ARTIFACT_ID: "11071941089"
    steps:
      - name: Trace beta research/dev hooks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src beta out
          curl -L --fail --retry 2             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip"             -o src/outer.zip
          unzip -q src/outer.zip -d src/outer
          nested="$(find src/outer -maxdepth 2 -type f -name 'fu_7-P2-R91-DEV-AUDIT.zip' | head -1)"

          # Extract beta rootfs only.
          unzip -Z1 "$nested" | grep 'report/rootfs/P2-R91-2.4.29b-20260422-101502-sysupgrade.bin__ubi__.*_vol-rootfs.ubifs/' > src/beta-files.txt
          while IFS= read -r member; do
            unzip -q "$nested" "$member" -d beta || true
          done < src/beta-files.txt
          root="$(find beta/report/rootfs -maxdepth 1 -type d -name 'P2-R91-2.4.29b-*' | head -1)"

          {
            echo '===== ROM FLAG FILES ====='
            find "$root/etc" -maxdepth 1 -type f -name 'rom*' -printf '%P %s bytes\n' | sort
            echo
            echo '===== rom_research REFERENCES ====='
            grep -RIna --binary-files=text -E 'rom_research|/etc/rom_research|research' "$root" 2>/dev/null | head -1000 || true
            echo
            echo '===== DEV/DEBUG/FACTORY REFERENCES ====='
            grep -RIna --binary-files=text -E 'developer|development|debug|factory|engineering|engmode|eng_mode|testmode|test_mode|diagnostic|packet.?capture|tcpdump|pcap' "$root/etc" "$root/usr/lib/lua" "$root/usr/lib" "$root/www" 2>/dev/null | head -2500 || true
            echo
            echo '===== REMOTE/SHELL SERVICES ====='
            grep -RIna --binary-files=text -E 'telnetd|dropbear|sshd|microcom|/bin/(ash|sh)|console|uart|ttyS|ttyUSB|nc -l|netcat' "$root/etc" "$root/usr/lib/lua" "$root/usr/lib" "$root/www" 2>/dev/null | head -2500 || true
            echo
            echo '===== GCOM / CELLULAR CONTROL ROUTES ====='
            grep -RIna --binary-files=text -E 'network\.gcom|gcom|CellularUpgrade|cellular|modem|at\+|AT\+' "$root/usr/lib/lua" "$root/usr/lib/4g" "$root/etc" 2>/dev/null | head -3000 || true
            echo
            echo '===== LUCI CONTROLLERS ====='
            find "$root/usr/lib/lua/luci/controller" -maxdepth 1 -type f -printf '%f\n' | sort
            echo
            echo '===== TOOL/DIAG MODELS ====='
            find "$root/usr/lib/lua/luci/model/cbi" -type f | grep -Ei '/(tools|diag|system|gcom|cellular|developer|debug|factory)/' | sed "s#^$root/##" | sort
            echo
            echo '===== INIT SERVICES OF INTEREST ====='
            find "$root/etc/init.d" -type f -printf '%f\n' | grep -Ei 'telnet|dropbear|ssh|debug|diag|gcom|4g|modem|uhttpd|rpc' | sort || true
          } > out/fu_7-P2-RESEARCH-FLAG-TRACE.txt

          cat out/fu_7-P2-RESEARCH-FLAG-TRACE.txt
          zip -q fu_7-P2-RESEARCH-FLAG-TRACE.zip out/fu_7-P2-RESEARCH-FLAG-TRACE.txt
      - name: Upload trace
        uses: actions/upload-artifact@v4
        with:
          name: fu_7-P2-RESEARCH-FLAG-TRACE
          retention-days: 30
          if-no-files-found: error
          path: |
            fu_7-P2-RESEARCH-FLAG-TRACE.zip
            out/fu_7-P2-RESEARCH-FLAG-TRACE.txt
