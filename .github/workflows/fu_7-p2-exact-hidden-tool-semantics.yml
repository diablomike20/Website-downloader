name: FU_7 P2 Exact Hidden Tool Semantics
on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - ".github/workflows/fu_7-p2-exact-hidden-tool-semantics.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_ARTIFACT_ID: "11071941089"
    steps:
      - name: Decode exact hidden-tool semantics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src roots out
          curl -L --fail --retry 2             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip"             -o src/outer.zip
          unzip -q src/outer.zip -d src/outer
          nested="$(find src/outer -maxdepth 2 -type f -name 'fu_7-P2-R91-DEV-AUDIT.zip' | head -1)"
          unzip -Z1 "$nested" | grep 'report/rootfs/P2-R91-2.4.29b-20260422-101502-sysupgrade.bin__ubi__.*_vol-rootfs.ubifs/' |             grep -E '/usr/lib/lua/luci/(controller/(system|gcom|diag)\.lua|model/cbi/system/(terminal|sandbox|preset|firstboot)\.lua|model/cbi/gcom/(atcmd|magic|upgrade|reset)\.lua|description\.lua|gui\.lua)$'             > src/members.txt
          while IFS= read -r m; do unzip -q "$nested" "$m" -d roots || true; done < src/members.txt
          root="$(find roots/report/rootfs -maxdepth 1 -type d -name 'P2-R91-2.4.29b-*' | head -1)"

          python3 - "$root" <<'PY'
          import os, subprocess, sys, re, hashlib
          from pathlib import Path
          root=Path(sys.argv[1])
          targets=[
            "usr/lib/lua/luci/controller/system.lua",
            "usr/lib/lua/luci/controller/gcom.lua",
            "usr/lib/lua/luci/controller/diag.lua",
            "usr/lib/lua/luci/model/cbi/system/terminal.lua",
            "usr/lib/lua/luci/model/cbi/system/sandbox.lua",
            "usr/lib/lua/luci/model/cbi/system/preset.lua",
            "usr/lib/lua/luci/model/cbi/system/firstboot.lua",
            "usr/lib/lua/luci/model/cbi/gcom/atcmd.lua",
            "usr/lib/lua/luci/model/cbi/gcom/magic.lua",
            "usr/lib/lua/luci/model/cbi/gcom/upgrade.lua",
            "usr/lib/lua/luci/model/cbi/gcom/reset.lua",
            "usr/lib/lua/luci/description.lua",
            "usr/lib/lua/luci/gui.lua",
          ]
          out=[]
          interesting=re.compile(r'(entry|cbi|template|alias|call|terminal|sandbox|preset|firstboot|telnet|atcmd|AT Command|magic|upgrade|reset|diag|developer|research|factory|hidden|feature|permission|acl|access|os\.execute|io\.popen|sys\.exec|util\.exec|ubus|network\.gcom|cmd|command|historic|bdinfo|rom_)',re.I)
          for rel in targets:
              p=root/rel
              if not p.exists(): continue
              data=p.read_bytes()
              sha=hashlib.sha256(data).hexdigest()
              try:
                  s=subprocess.check_output(["strings","-a","-n","2",str(p)],text=True,errors="replace")
              except Exception:s=""
              lines=s.splitlines()
              out.append(f"===== {rel} =====")
              out.append(f"size={len(data)} sha256={sha}")
              for i,line in enumerate(lines):
                  if interesting.search(line):
                      lo=max(0,i-4);hi=min(len(lines),i+9)
                      out.extend(f"{j+1}:{lines[j]}" for j in range(lo,hi))
                      out.append("---")
          Path("out/fu_7-P2-EXACT-HIDDEN-TOOL-SEMANTICS.txt").write_text("\n".join(out),errors="replace")
          PY

          cat out/fu_7-P2-EXACT-HIDDEN-TOOL-SEMANTICS.txt
          zip -q fu_7-P2-EXACT-HIDDEN-TOOL-SEMANTICS.zip out/fu_7-P2-EXACT-HIDDEN-TOOL-SEMANTICS.txt
      - name: Upload semantics
        uses: actions/upload-artifact@v4
        with:
          name: fu_7-P2-EXACT-HIDDEN-TOOL-SEMANTICS
          retention-days: 30
          if-no-files-found: error
          path: |
            fu_7-P2-EXACT-HIDDEN-TOOL-SEMANTICS.zip
            out/fu_7-P2-EXACT-HIDDEN-TOOL-SEMANTICS.txt
