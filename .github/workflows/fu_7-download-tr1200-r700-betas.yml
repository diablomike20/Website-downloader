name: FU_7 Download TR1200 and R700 Betas

on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - ".github/workflows/fu_7-download-tr1200-r700-betas.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install download helpers
        shell: bash
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq megatools >/dev/null
          python3 -m pip install --quiet gdown

      - name: Download Cudy beta firmware payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered

          echo "=== TR1200 signed beta from MEGA ==="
          (
            cd recovered
            megadl 'https://mega.nz/file/Lixz3Z4K#wcGY0-oqeiLqU_CMFO8lQ0TpU_kE-slh8ebYUkX6nNQ'
          ) || true

          echo "=== R700 WAN VLAN beta from Google Drive ==="
          gdown --fuzzy             'https://drive.google.com/file/d/12Y3ktMv9M-nyD8ezzwi4kkSvNBUMvZA3/view?usp=sharing'             -O recovered/R700-Cudy-beta-drive-download || true

          find recovered -maxdepth 1 -type f -printf '%f %s bytes\n'

          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path

          rows=[]
          for p in sorted(Path("recovered").glob("*")):
              if not p.is_file(): continue
              data=p.read_bytes()
              htmlish=b"<html" in data[:2000].lower() or b"<!doctype" in data[:2000].lower()
              if len(data)<100000 or htmlish:
                  print("REJECT",p,len(data),"htmlish",htmlish)
                  p.unlink()
                  continue
              sha=hashlib.sha256(data).hexdigest()
              rows.append({"filename":p.name,"size":len(data),"sha256":sha})
              print("SAVED",p.name,len(data),sha)

          Path("fu_7-TR1200-R700-BETA-MANIFEST.json").write_text(
              json.dumps(rows,indent=2,ensure_ascii=False),encoding="utf-8")
          PY

      - name: Upload beta payloads
        uses: actions/upload-artifact@v4
        with:
          name: fu_7-TR1200-R700-BETAS
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
          path: |
            recovered/*
            fu_7-TR1200-R700-BETA-MANIFEST.json
