name: FU_7 Harvest Private Support Firmware Leads

on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - ".github/workflows/fu_7-harvest-private-support-firmware-leads.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_ARTIFACT_ID: "11065773368"

    steps:
      - name: Download support-mail evidence artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src recovered evidence
          curl -L --fail --retry 2             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip"             -o src/source.zip
          unzip -q src/source.zip -d src/unpacked
          find src/unpacked -type f -maxdepth 2 -printf '%p %s bytes\n'
          echo "=== HEADERS ==="
          for f in src/unpacked/*.csv; do echo "--- $f"; head -2 "$f" || true; done

      - name: Parse private beta/dev leads and recover public binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,glob,hashlib,html,json,os,re,urllib.parse,urllib.request

          UA="Mozilla/5.0 OpenCudy-FU7-Private-Support-Harvest"
          files=glob.glob("src/unpacked/*.csv")
          rows=[]
          for fp in files:
              try:
                  with open(fp,encoding="utf-8-sig",errors="ignore") as f:
                      rr=list(csv.DictReader(f))
                  for r in rr:
                      r["_source_csv"]=os.path.basename(fp)
                      rows.append(r)
              except Exception as e:
                  print("CSV_FAIL",fp,repr(e))

          # Normalize all row text and retain actual support-delivery/dev-beta-like evidence.
          dev_terms=[
            "beta firmware","test firmware","new beta","2.5.","beta update",
            "sent you the firmware","sent you firmware","firmware via email",
            "technical support has sent","technical support has contacted",
            "middle firmware","intermediate firmware","transitional firmware",
            "zerotier","wisp","mesh"
          ]
          model_re=re.compile(r'\b(?:WR|M|LT|P|TR|AP|RE|C|R|IR|X|GP|WBR)[A-Z0-9+.-]{1,20}\b',re.I)
          ver_re=re.compile(r'\b(?:\d+\.\d+(?:\.\d+)?(?:Beta|beta|b)?(?:-\d{8}-\d{6})?|[A-Z]?[0-9]{1,3}-\d+\.\d+(?:\.\d+)?(?:Beta|beta|b)?-\d{8}-\d{6})\b')
          url_re=re.compile(r'https?://[^\s"\'<>]+',re.I)

          leads=[]
          urls=[]
          for r in rows:
              blob=" ".join(str(v) for k,v in r.items() if k!="_source_csv")
              low=blob.lower()
              if not any(t in low for t in dev_terms): continue
              models=sorted(set(model_re.findall(blob)),key=str.lower)
              versions=sorted(set(ver_re.findall(blob)),key=str.lower)
              direct=[]
              for u in url_re.findall(html.unescape(blob)):
                  u=u.rstrip(').,;]}')
                  if any(h in u.lower() for h in (
                    "drive.google","mega.nz","mediafire","dropbox","1drv.ms",
                    "onedrive","cudy.com/cdn/shop/files","cdn.shopify.com"
                  )):
                      direct.append(u)
                      urls.append({"url":u,"source_csv":r["_source_csv"],"models":models,"versions":versions,"context":blob[:5000]})
              leads.append({
                  "source_csv":r["_source_csv"],
                  "models":" | ".join(models),
                  "versions":" | ".join(versions),
                  "direct_urls":" | ".join(sorted(set(direct))),
                  "context":blob[:9000]
              })

          # Dedup leads.
          uniq=[];seen=set()
          for x in leads:
              k=(x["models"],x["versions"],x["context"][:1800])
              if k in seen:continue
              seen.add(k);uniq.append(x)

          # Expand Google Drive links.
          cand=[]
          def add(u,meta):
              u=html.unescape(u).replace("\\u0026","&")
              if not any(x["url"]==u for x in cand):
                  cand.append({"url":u,**meta})
          for x in urls:
              add(x["url"],x)
              u=x["url"]
              if "drive.google" in u.lower():
                  m=re.search(r'/file/d/([^/]+)',u) or re.search(r'[?&]id=([^&]+)',u)
                  if m:
                      fid=m.group(1)
                      add(f"https://drive.usercontent.google.com/download?id={fid}&export=download&confirm=t",x)
                      add(f"https://drive.google.com/uc?export=download&id={fid}&confirm=t",x)

          def fetch(url,timeout=100):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"*/*"})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.read(),r.status,dict(r.headers)

          downloads=[]
          bysha={}
          for i,x in enumerate(cand,1):
              u=x["url"]
              try:
                  data,st,h=fetch(u)
                  sha=hashlib.sha256(data).hexdigest()
                  ct=h.get("Content-Type","")
                  htmlish=b"<html" in data[:2000].lower() or b"<!doctype" in data[:2000].lower()
                  rec={"url":u,"status":st,"size":len(data),"sha256":sha,"content_type":ct,
                       "models":" | ".join(x.get("models",[])) if isinstance(x.get("models"),list) else x.get("models",""),
                       "versions":" | ".join(x.get("versions",[])) if isinstance(x.get("versions"),list) else x.get("versions",""),
                       "saved_as":""}
                  if len(data)>500_000 and not htmlish and ("text/html" not in ct.lower()):
                      cd=h.get("Content-Disposition","");name=""
                      mm=re.search(r'filename\*?=(?:UTF-8\'\')?["\']?([^;"\']+)',cd,re.I)
                      if mm:name=urllib.parse.unquote(mm.group(1).strip())
                      if not name:name=urllib.parse.unquote(urllib.parse.urlsplit(u).path.rsplit("/",1)[-1])
                      if not name or "." not in name:name="support-private-"+sha[:12]+".bin"
                      name=re.sub(r'[^A-Za-z0-9._()+ -]+','_',name)
                      if sha not in bysha:
                          out=os.path.join("recovered",name)
                          if os.path.exists(out):out=os.path.join("recovered",sha[:8]+"-"+name)
                          open(out,"wb").write(data)
                          bysha[sha]=out
                      rec["saved_as"]=bysha[sha]
                      print("SAVED",rec["saved_as"],len(data),sha,u)
                  downloads.append(rec)
              except Exception as e:
                  downloads.append({"url":u,"error":repr(e)})

          os.makedirs("evidence",exist_ok=True)
          with open("evidence/fu_7-PRIVATE-SUPPORT-LEADS.csv","w",newline="",encoding="utf-8-sig") as f:
              fields=["source_csv","models","versions","direct_urls","context"]
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(uniq)
          with open("evidence/fu_7-PRIVATE-SUPPORT-DOWNLOADS.csv","w",newline="",encoding="utf-8-sig") as f:
              fields=["url","status","size","sha256","content_type","models","versions","saved_as","error"]
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader()
              for d in downloads:w.writerow({k:d.get(k,"") for k in fields})
          summary={"rows_scanned":len(rows),"private_dev_leads":len(uniq),"candidate_urls":len(cand),
                   "saved_unique":len(bysha),
                   "saved":[{"sha256":sha,"path":p,"size":os.path.getsize(p)} for sha,p in bysha.items()]}
          json.dump(summary,open("evidence/fu_7-PRIVATE-SUPPORT-SUMMARY.json","w"),indent=2,ensure_ascii=False)
          print(json.dumps(summary,indent=2,ensure_ascii=False))
          PY

      - name: Upload recovered private builds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fu_7-PRIVATE-SUPPORT-FIRMWARE-HARVEST
          retention-days: 30
          if-no-files-found: warn
          path: |
            recovered/*
            evidence/*
