name: FU_7 P2 Visibility Gate Disassembly
on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - ".github/workflows/fu_7-p2-visibility-gate-disasm.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_ARTIFACT_ID: "11071941089"
    steps:
      - name: Disassemble registry and controller bytecode
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 >/dev/null
          mkdir -p src roots out
          curl -L --fail --retry 2             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip"             -o src/outer.zip
          unzip -q src/outer.zip -d src/outer
          nested="$(find src/outer -maxdepth 2 -type f -name 'fu_7-P2-R91-DEV-AUDIT.zip' | head -1)"
          unzip -Z1 "$nested" | grep -E 'report/rootfs/P2-R91-(2\.4\.22-20251204-184925|2\.4\.29b-20260422-101502)-sysupgrade\.bin__ubi__.*_vol-rootfs\.ubifs/usr/lib/lua/luci/(description|gui|controller/system)\.lua$' > src/members.txt
          while IFS= read -r m; do unzip -q "$nested" "$m" -d roots || true; done < src/members.txt

          : > out/fu_7-P2-VISIBILITY-GATE-DISASM.txt
          while IFS= read -r f; do
            echo "===== $f =====" >> out/fu_7-P2-VISIBILITY-GATE-DISASM.txt
            sha256sum "$f" >> out/fu_7-P2-VISIBILITY-GATE-DISASM.txt
            luac5.1 -l -l "$f" >> out/fu_7-P2-VISIBILITY-GATE-DISASM.txt 2>&1 || true
            echo >> out/fu_7-P2-VISIBILITY-GATE-DISASM.txt
          done < <(find roots -type f | sort)

          echo '===== FOCUSED CONSTANT/INSTRUCTION CONTEXT ====='
          grep -Ein -B18 -A28 'terminal|sandbox|preset|firstboot|diag|gcom|atcmd|magic|airdump|research|release|factory|feature|visible|hidden|show|support|historic' out/fu_7-P2-VISIBILITY-GATE-DISASM.txt | head -6000 || true
          zip -q fu_7-P2-VISIBILITY-GATE-DISASM.zip out/fu_7-P2-VISIBILITY-GATE-DISASM.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fu_7-P2-VISIBILITY-GATE-DISASM
          retention-days: 30
          if-no-files-found: error
          path: |
            fu_7-P2-VISIBILITY-GATE-DISASM.zip
            out/fu_7-P2-VISIBILITY-GATE-DISASM.txt
