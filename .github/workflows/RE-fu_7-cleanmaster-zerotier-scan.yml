name: RE FU7 Clean Master ZeroTier Scan

on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - ".github/workflows/RE-fu_7-cleanmaster-zerotier-scan.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fu_7-cudy-cdn-index

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools binutils file unzip >/dev/null

      - name: Download exact FU7 clean master
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p RE-FU7-CLEANMASTER-ZT
          curl -L --fail --retry 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11068611598/zip" \
            -o RE-FU7-CLEANMASTER-ZT/master-artifact.zip
          unzip -q RE-FU7-CLEANMASTER-ZT/master-artifact.zip -d RE-FU7-CLEANMASTER-ZT/artifact
          find RE-FU7-CLEANMASTER-ZT/artifact -type f -printf '%p\t%s\n' | sort

      - name: Extract and audit all SquashFS rootfs
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import csv, hashlib, json, os, re, shutil, struct, subprocess
          from pathlib import Path

          base=Path("RE-FU7-CLEANMASTER-ZT")
          art=base/"artifact"
          roots=base/"roots"
          roots.mkdir(parents=True,exist_ok=True)

          binaries=[]
          for p in art.rglob("*"):
              if p.is_file() and p.suffix.lower() in (".bin",".img",".trx",".itb",".fw",".rom"):
                  binaries.append(p)

          def sh(cmd,timeout=120):
              try:
                  return subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,
                                        text=True,timeout=timeout).stdout
              except Exception as e:
                  return "ERROR "+repr(e)

          def sha(p):
              h=hashlib.sha256()
              with open(p,"rb") as f:
                  for b in iter(lambda:f.read(1024*1024),b""): h.update(b)
              return h.hexdigest()

          def sq_offsets(p):
              data=p.read_bytes()
              out=[]; i=0
              while True:
                  i=data.find(b"hsqs",i)
                  if i<0: break
                  out.append(i); i+=4
              return out

          def resolved_size(p):
              try:
                  if p.is_symlink():
                      q=(p.parent/os.readlink(p)).resolve()
                      return q.stat().st_size if q.exists() else 0
                  return p.stat().st_size
              except: return 0

          def find_lib(root,n):
              for p in root.rglob(n):
                  if p.is_file() or p.is_symlink(): return p
              stem=n.split(".so")[0]+".so"
              for p in root.rglob(stem+"*"):
                  if p.is_file() or p.is_symlink(): return p
              return None

          rows=[]
          fw_rows=[]
          for n,p in enumerate(sorted(binaries)):
              offs=sq_offsets(p)
              fw_rows.append({
                  "firmware":p.name,"size":p.stat().st_size,"sha256":sha(p),
                  "squashfs_offsets":"|".join(hex(x) for x in offs)
              })
              for off in offs:
                  sq=base/f"sq_{n}_{off:x}.bin"
                  with open(p,"rb") as f:
                      f.seek(off); sq.write_bytes(f.read())
                  root=roots/f"{n}_{off:x}"
                  if root.exists(): shutil.rmtree(root)
                  out=sh(["unsquashfs","-no-progress","-d",str(root),str(sq)],180)
                  if not root.exists(): continue
                  for zt in root.rglob("zerotier-one"):
                      if not zt.is_file(): continue
                      dyn=sh(["readelf","-d",str(zt)],30)
                      hdr=sh(["readelf","-h",str(zt)],30)
                      needed=re.findall(r"Shared library: \[(.*?)\]",dyn)
                      libs=[]
                      dep_total=0
                      for lib in needed:
                          lp=find_lib(root,lib)
                          lsz=resolved_size(lp) if lp else 0
                          libs.append({
                              "name":lib,
                              "path":str(lp.relative_to(root)) if lp else "MISSING",
                              "size":lsz
                          })
                          # For WR1200 R26, libc + libgcc are already in base.
                          if lib not in ("libc.so","libgcc_s.so.1"):
                              dep_total += lsz
                      strings=sh(["strings","-a",str(zt)],60)
                      vers=sorted(set(re.findall(r"\b(?:0|1|2)\.\d+\.\d+\b",strings)))
                      arch=" | ".join(x.strip() for x in hdr.splitlines()
                          if any(k in x for k in ("Class:","Data:","Machine:","Flags:")))
                      rows.append({
                          "firmware":p.name,
                          "firmware_sha256":sha(p),
                          "squashfs_offset":hex(off),
                          "zerotier_path":str(zt.relative_to(root)),
                          "zerotier_size":zt.stat().st_size,
                          "zerotier_sha256":sha(zt),
                          "version_candidates":vers,
                          "arch":arch,
                          "needed":needed,
                          "libraries":libs,
                          "extra_dependency_bytes":dep_total,
                          "estimated_payload":zt.stat().st_size+dep_total,
                          "saving_vs_R25":2140557-(zt.stat().st_size+dep_total)
                      })

          # de-dupe same ZT hash but keep provenance
          grouped={}
          for r in rows:
              h=r["zerotier_sha256"]
              if h not in grouped:
                  grouped[h]=dict(r)
                  grouped[h]["provenance"]=[r["firmware"]]
              else:
                  grouped[h]["provenance"].append(r["firmware"])
          builds=list(grouped.values())
          builds.sort(key=lambda x:(x["estimated_payload"],x["zerotier_size"]))

          result={
              "artifact_id":11068611598,
              "firmware_images_scanned":len(binaries),
              "firmware_inventory":fw_rows,
              "zerotier_occurrences":len(rows),
              "distinct_zerotier_builds":len(builds),
              "builds":builds
          }
          (base/"RE-FU7-CLEANMASTER-ZEROTIER-SCAN.json").write_text(
              json.dumps(result,indent=2,ensure_ascii=False))

          with open(base/"RE-FU7-CLEANMASTER-ZEROTIER-SCAN.csv","w",newline="",encoding="utf-8-sig") as f:
              fields=["rank","zerotier_size","extra_dependency_bytes","estimated_payload",
                      "saving_vs_R25","zerotier_sha256","version_candidates","arch","needed","provenance"]
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader()
              for i,r in enumerate(builds,1):
                  w.writerow({
                      "rank":i,"zerotier_size":r["zerotier_size"],
                      "extra_dependency_bytes":r["extra_dependency_bytes"],
                      "estimated_payload":r["estimated_payload"],
                      "saving_vs_R25":r["saving_vs_R25"],
                      "zerotier_sha256":r["zerotier_sha256"],
                      "version_candidates":"|".join(r["version_candidates"]),
                      "arch":r["arch"],"needed":"|".join(r["needed"]),
                      "provenance":"|".join(r["provenance"])
                  })

          md=["# FU7 clean master ZeroTier scan","",
              f"Firmware images scanned: **{len(binaries)}**",
              f"ZeroTier occurrences: **{len(rows)}**",
              f"Distinct ZeroTier builds: **{len(builds)}**","",
              "| Rank | zerotier-one | extra deps | payload | saving vs R25 | SHA256 | Provenance |",
              "|---:|---:|---:|---:|---:|---|---|"]
          for i,r in enumerate(builds,1):
              md.append(f"| {i} | {r['zerotier_size']} | {r['extra_dependency_bytes']} | {r['estimated_payload']} | {r['saving_vs_R25']} | \`{r['zerotier_sha256'][:16]}…\` | {'; '.join(r['provenance'])} |")
          if not builds:
              md += ["","**No zerotier-one executable found in any FU7 clean-master firmware rootfs.**"]
          md += ["","## Firmware inventory"]
          for r in fw_rows:
              md.append(f"- \`{r['firmware']}\` — {r['size']} B — SquashFS: {r['squashfs_offsets'] or 'none'}")
          (base/"RE-FU7-CLEANMASTER-ZEROTIER-SCAN.md").write_text("\n".join(md)+"\n")

          print(json.dumps(result,indent=2,ensure_ascii=False))
          PY

      - name: Show result
        if: always()
        run: cat RE-FU7-CLEANMASTER-ZT/RE-FU7-CLEANMASTER-ZEROTIER-SCAN.md || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RE-FU7-CLEANMASTER-ZEROTIER-SCAN
          retention-days: 30
          if-no-files-found: error
          path: |
            RE-FU7-CLEANMASTER-ZT/RE-FU7-CLEANMASTER-ZEROTIER-SCAN.*
            RE-FU7-CLEANMASTER-ZT/artifact/**/MANIFEST.csv

      - name: Publish latest result
        if: always()
        shell: bash
        run: |
          set -e
          mkdir -p RE-FU7-CLEANMASTER-ZEROTIER-SCAN-LATEST
          cp RE-FU7-CLEANMASTER-ZT/RE-FU7-CLEANMASTER-ZEROTIER-SCAN.json RE-FU7-CLEANMASTER-ZEROTIER-SCAN-LATEST/ 2>/dev/null || true
          cp RE-FU7-CLEANMASTER-ZT/RE-FU7-CLEANMASTER-ZEROTIER-SCAN.csv RE-FU7-CLEANMASTER-ZEROTIER-SCAN-LATEST/ 2>/dev/null || true
          cp RE-FU7-CLEANMASTER-ZT/RE-FU7-CLEANMASTER-ZEROTIER-SCAN.md RE-FU7-CLEANMASTER-ZEROTIER-SCAN-LATEST/ 2>/dev/null || true
          git config user.name "OpenCudy RE Bot"
          git config user.email "73985391+diablomike20@users.noreply.github.com"
          git add RE-FU7-CLEANMASTER-ZEROTIER-SCAN-LATEST
          git diff --cached --quiet && exit 0
          git commit -m "RE: publish FU7 clean-master ZeroTier scan"
          git push origin HEAD:fu_7-cudy-cdn-index
