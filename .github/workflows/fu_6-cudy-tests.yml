name: fu_6 Cudy forensic tests

on:
  push:
    branches:
      - fu_6-cudy-forensic
  pull_request:
    branches:
      - master

jobs:
  cudy-forensic:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [16, 18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:cudy
