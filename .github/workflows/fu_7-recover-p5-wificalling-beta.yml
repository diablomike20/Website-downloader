name: FU_7 Recover P5 WiFi Calling Beta
on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - ".github/workflows/fu_7-recover-p5-wificalling-beta.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Recover P5 beta from Cudy page, CDN and archive
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import os,re,json,csv,hashlib,urllib.parse,urllib.request
          from html.parser import HTMLParser

          UA="OpenCudy-FU7-P5-Beta/1.0"
          marker="P5-R21-1.15.15-20230616-112055-sysupgrade"
          pages=[
            "https://www.cudy.com/en-ca/blogs/faq/how-to-fix-t-mobile-wi-fi-calling-issues-on-p5",
            "https://www.cudy.com/en-me/blogs/faq/how-to-fix-t-mobile-wi-fi-calling-issues-on-p5",
          ]
          candidates=[
            "https://www.cudy.com/cdn/shop/files/"+marker,
            "https://www.cudy.com/cdn/shop/files/"+marker+".bin",
            "https://cdn.shopify.com/s/files/1/0673/4748/0820/files/"+marker,
            "https://cdn.shopify.com/s/files/1/0673/4748/0820/files/"+marker+".bin",
          ]
          def fetch(url,timeout=60):
            req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"*/*"})
            with urllib.request.urlopen(req,timeout=timeout) as r:
              return r.read(),r.status,dict(r.headers)

          # Pull exact hrefs from current Cudy page source.
          href_re=re.compile(rb'href=["\']([^"\']+)["\']',re.I)
          for page in pages:
            try:
              body,_,_=fetch(page,40)
            except Exception as e:
              print("PAGE_FAIL",page,repr(e)); continue
            for h in href_re.findall(body):
              u=h.decode("utf-8","replace").replace("&amp;","&")
              if marker.lower() in u.lower():
                candidates.append(urllib.parse.urljoin(page,u))
            # also collect links surrounding visible marker
            txt=body.decode("utf-8","replace")
            pos=txt.lower().find(marker.lower())
            if pos>=0:
              frag=txt[max(0,pos-2500):pos+2500]
              for m in re.finditer(r'href=["\']([^"\']+)["\']',frag,re.I):
                candidates.append(urllib.parse.urljoin(page,m.group(1).replace("&amp;","&")))

          # Wayback CDX exact marker across alias and old Shopify.
          for scope in [
            "www.cudy.com/cdn/shop/files/*",
            "cdn.shopify.com/s/files/1/0673/4748/0820/files/*",
            "www.cudy.com/*",
          ]:
            params=[
              ("url",scope),("output","json"),
              ("fl","timestamp,original,statuscode,mimetype,digest,length"),
              ("filter","statuscode:200"),
              ("filter","original:.*"+re.escape(marker)+".*"),
              ("collapse","urlkey"),
            ]
            url="https://web.archive.org/cdx/search/cdx?"+urllib.parse.urlencode(params)
            try:
              b,_,_=fetch(url,120); d=json.loads(b.decode("utf-8","replace"))
            except Exception as e:
              print("CDX_FAIL",scope,repr(e));continue
            if not d:continue
            hdr=d[0]
            for row in d[1:]:
              o=dict(zip(hdr,row)); orig=o.get("original","");ts=o.get("timestamp","")
              if orig:
                candidates.append(orig)
                if ts:candidates.append(f"https://web.archive.org/web/{ts}id_/{orig}")

          # Unique and attempt downloads.
          seen=set(); candidates=[x for x in candidates if x and not (x in seen or seen.add(x))]
          os.makedirs("fu_7-P5-WIFICALLING-BETA",exist_ok=True)
          rows=[]; saved=[]
          for u in candidates:
            try:data,st,h=fetch(u,90)
            except Exception as e:
              rows.append({"source":u,"result":"FAIL","size":"","sha256":"","detail":repr(e)});continue
            sha=hashlib.sha256(data).hexdigest()
            if len(data)<1024 or b"<html" in data[:512].lower() or b"<!doctype" in data[:512].lower():
              rows.append({"source":u,"result":"NON_BINARY","size":len(data),"sha256":sha,"detail":h.get("Content-Type","")});continue
            cd=h.get("Content-Disposition","")
            fn=""
            m=re.search(r'filename\*?=(?:UTF-8\'\')?["\']?([^;"\']+)',cd,re.I)
            if m: fn=urllib.parse.unquote(m.group(1).strip())
            if not fn:
              fn=urllib.parse.unquote(urllib.parse.urlsplit(u).path.rsplit("/",1)[-1]) or marker+".bin"
            if "." not in fn:fn=fn+".bin"
            fn=re.sub(r'[^A-Za-z0-9._()+ -]','_',fn)
            p=os.path.join("fu_7-P5-WIFICALLING-BETA",fn)
            if os.path.exists(p): p=os.path.join("fu_7-P5-WIFICALLING-BETA",sha[:8]+"-"+fn)
            open(p,"wb").write(data)
            rec={"source":u,"result":"SAVED","size":len(data),"sha256":sha,"detail":os.path.basename(p)}
            rows.append(rec);saved.append(rec)
            print("SAVED",rec)
          with open("fu_7-P5-WIFICALLING-BETA-MANIFEST.csv","w",newline="",encoding="utf-8") as f:
            w=csv.DictWriter(f,fieldnames=["source","result","size","sha256","detail"]);w.writeheader();w.writerows(rows)
          summary={"marker":marker,"saved":saved,"candidate_urls":len(candidates)}
          open("fu_7-P5-WIFICALLING-BETA-SUMMARY.json","w",encoding="utf-8").write(json.dumps(summary,indent=2,ensure_ascii=False))
          print(json.dumps(summary,indent=2,ensure_ascii=False))
          PY
      - name: Pack
        if: always()
        run: zip -r -9 fu_7-P5-WIFICALLING-BETA.zip fu_7-P5-WIFICALLING-BETA fu_7-P5-WIFICALLING-BETA-MANIFEST.csv fu_7-P5-WIFICALLING-BETA-SUMMARY.json || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fu_7-P5-WIFICALLING-BETA
          retention-days: 30
          if-no-files-found: warn
          path: |
            fu_7-P5-WIFICALLING-BETA.zip
            fu_7-P5-WIFICALLING-BETA-MANIFEST.csv
            fu_7-P5-WIFICALLING-BETA-SUMMARY.json
