name: FU_7 R25 LT500 CDN Fast
on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - "scripts/fu_7_r25_lt500_cdn_fast.py"
      - ".github/workflows/fu_7-r25-lt500-cdn-fast.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fast 2026 CDN hunt
        run: python3 scripts/fu_7_r25_lt500_cdn_fast.py
      - name: Results
        if: always()
        run: |
          cat fu_7-R25-LT500-CDN-FAST-SUMMARY.json || true
          echo "=== HITS ==="
          cat fu_7-R25-LT500-CSP25-FAST-HITS.csv || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fu_7-R25-LT500-CDN-FAST
          retention-days: 30
          if-no-files-found: warn
          path: |
            fu_7-R25-LT500-CDN-FAST-INDEX.csv
            fu_7-R25-LT500-CSP25-FAST-HITS.csv
            fu_7-R25-LT500-CDN-FAST-SUMMARY.json
