name: RE WR1300 ZeroTier Donor Scan

on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - ".github/workflows/RE-wr1300-zerotier-donor-scan.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: fu_7-cudy-cdn-index }
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools binutils unzip file >/dev/null
      - shell: bash
        run: |
          set -euxo pipefail
          mkdir -p RE-WR1300-ZT
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess,urllib.request,zipfile
          from pathlib import Path
          out=Path("RE-WR1300-ZT")
          urls={
            "WR1300V1-R10-1.13.6":"https://www.cudy.com/cdn/shop/files/WR1300-R10-1.13.6-20220314-112409-flash_1.zip",
            "WR1300V2-R23-2.0.4":"https://www.cudy.com/cdn/shop/files/WR1300B-R23-2.0.4-20240206-090502-flash_1.zip",
            "WR1300V2-R23-2.2.6":"https://www.cudy.com/cdn/shop/files/WR1300B-R23-2.2.6-20240815-095128-flash.zip",
            "WR1300V2-R23-2.3.9":"https://www.cudy.com/cdn/shop/files/WR1300B-R23-2.3.9-20250208-115514-flash.zip",
            "WR1300V2-R23-2.4.4":"https://www.cudy.com/cdn/shop/files/WR1300B-R23-2.4.4-20250507-170413-flash.zip",
            "WR1300V2-R23-2.5.25":"https://www.cudy.com/cdn/shop/files/WR1300B-R23-2.5.25-20260805-113408-flash.zip",
          }
          def get(u):
            req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0 OpenCudy-RE","Accept":"*/*"})
            with urllib.request.urlopen(req,timeout=120) as r:return r.read()
          def sha(b):return hashlib.sha256(b).hexdigest()
          def findlib(root,n):
            for p in root.rglob(n):
              if p.is_file() or p.is_symlink():return p
            stem=n.split(".so")[0]+".so"
            for p in root.rglob(stem+"*"):
              if p.is_file() or p.is_symlink():return p
          def sz(p):
            try:
              if p.is_symlink():
                q=(p.parent/os.readlink(p)).resolve()
                return q.stat().st_size if q.exists() else 0
              return p.stat().st_size
            except:return 0
          res=[]
          for idx,(tag,u) in enumerate(urls.items()):
            item={"tag":tag,"url":u}
            try:b=get(u)
            except Exception as e:
              item["download_error"]=repr(e);res.append(item);continue
            z=out/f"{idx}.zip";z.write_bytes(b)
            item["zip_size"]=len(b);item["zip_sha256"]=sha(b)
            d=out/f"d{idx}";d.mkdir()
            try:
              with zipfile.ZipFile(z) as q:q.extractall(d)
            except Exception as e:
              item["zip_error"]=repr(e);res.append(item);continue
            item["firmwares"]=[]
            for fw in d.rglob("*"):
              if not fw.is_file() or fw.suffix.lower() not in (".bin",".img",".trx",".itb"):continue
              dat=fw.read_bytes(); off=dat.find(b"hsqs")
              fi={"name":fw.name,"size":len(dat),"sha256":sha(dat),"squashfs_offset":hex(off) if off>=0 else None,"zerotier":[]}
              if off>=0:
                sq=out/f"{idx}-{fw.name}.sqfs";sq.write_bytes(dat[off:])
                root=out/f"root-{idx}-{len(item['firmwares'])}"
                subprocess.run(["unsquashfs","-no-progress","-d",str(root),str(sq)],
                  stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                if root.exists():
                  rel=""
                  for rp in [root/"etc/openwrt_release",root/"etc/rom_version",root/"etc/openwrt_version"]:
                    if rp.exists():
                      try:rel+=rp.read_text(errors="ignore").strip()+" | "
                      except:pass
                  fi["release"]=rel
                  for zt in root.rglob("zerotier-one"):
                    if not zt.is_file():continue
                    hdr=subprocess.run(["readelf","-h",str(zt)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True).stdout
                    dyn=subprocess.run(["readelf","-d",str(zt)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True).stdout
                    need=re.findall(r"Shared library: \[(.*?)\]",dyn)
                    libs=[];extra=0
                    for n in need:
                      lp=findlib(root,n);lsz=sz(lp) if lp else 0
                      base=n in ("libc.so","libgcc_s.so.1")
                      libs.append({"name":n,"size":lsz,"path":str(lp.relative_to(root)) if lp else "MISSING","R26_base":base})
                      if not base:extra+=lsz
                    fi["zerotier"].append({
                      "size":zt.stat().st_size,"sha256":sha(zt.read_bytes()),
                      "needed":need,"libs":libs,"extra_dependency_bytes":extra,
                      "estimated_R26_payload":zt.stat().st_size+extra,
                      "saving_vs_R25":2140557-(zt.stat().st_size+extra),
                      "elf":" | ".join(x.strip() for x in hdr.splitlines() if any(k in x for k in ("Class:","Data:","Machine:","Flags:")))
                    })
              item["firmwares"].append(fi)
            res.append(item)
          (out/"RE-WR1300-ZEROTIER-DONOR-SCAN.json").write_text(json.dumps(res,indent=2))
          md=["# WR1300 ZeroTier donor scan",""]
          for r in res:
            md.append(f"## {r['tag']}")
            if r.get("download_error"):
              md.append(f"- DOWNLOAD ERROR: {r['download_error']}");continue
            for fw in r.get("firmwares",[]):
              md.append(f"- Firmware: \`{fw['name']}\` / {fw['size']} B")
              if not fw["zerotier"]:md.append("- zerotier-one: **NOT FOUND**")
              for z in fw["zerotier"]:
                md.append(f"- zerotier-one: **{z['size']} B**, payload on R26 ≈ **{z['estimated_R26_payload']} B**, saving **{z['saving_vs_R25']} B**")
                md.append(f"- SHA256: \`{z['sha256']}\`")
                md.append(f"- NEEDED: {', '.join(z['needed'])}")
                md.append(f"- ELF: {z['elf']}")
          (out/"RE-WR1300-ZEROTIER-DONOR-SCAN.md").write_text("\n".join(md)+"\n")
          print(json.dumps(res,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RE-WR1300-ZEROTIER-DONOR-SCAN
          retention-days: 30
          path: RE-WR1300-ZT/RE-WR1300-ZEROTIER-DONOR-SCAN.*
      - shell: bash
        run: |
          mkdir -p RE-WR1300-ZT-LATEST
          cp RE-WR1300-ZT/RE-WR1300-ZEROTIER-DONOR-SCAN.* RE-WR1300-ZT-LATEST/
          git config user.name "OpenCudy RE Bot"
          git config user.email "73985391+diablomike20@users.noreply.github.com"
          git add RE-WR1300-ZT-LATEST
          git diff --cached --quiet && exit 0
          git commit -m "RE: publish WR1300 ZeroTier donor scan"
          git push origin HEAD:fu_7-cudy-cdn-index
