name: fu_8 R25 MQTT firewall exposure static audit

on:
  push:
    branches:
      - fu_6-cudy-forensic
    paths:
      - ".github/workflows/fu_8-r25-mqtt-firewall-exposure.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools python3 >/dev/null

      - name: Exact stock static firewall ownership audit
        shell: bash
        run: |
          set -euxo pipefail
          OUT="fu_8-R25-MQTT-FIREWALL-EXPOSURE"
          mkdir -p "$OUT/results" "$OUT/work"
          cd "$OUT/work"

          curl -L --fail --retry 3 -o stock.bin "https://d1jvyy13vm72kv.cloudfront.net/device/upgrade/upgrade_LT500V2-R25-2.4.16-20250804-150319-flash_20729.bin"
          echo "57aed945a9f485d178d73a844e420fc2b441e60821e243d3d19d07dd4a3143d6  stock.bin" | sha256sum -c -
          tail -c "+2784590" stock.bin > rootfs.squashfs
          sudo unsquashfs -no-exit-code -d "$PWD/root" rootfs.squashfs >/dev/null 2>&1
          sudo chown -R "$(id -u):$(id -g)" root

          cp root/etc/config/firewall ../results/fu_8-source-etc_config_firewall.txt
          [ -f root/etc/firewall.user ] && cp root/etc/firewall.user ../results/fu_8-source-etc_firewall.user.txt || true

          # Exact explicit references to MQTT ports/services in static firewall/config/init/default trees.
          find root/etc/config root/etc/init.d root/etc/uci-defaults root/etc/firewall* root/usr/lib root/usr/sbin root/usr/bin             -type f -print0 2>/dev/null             | xargs -0 -r grep -IanE '(^|[^0-9])(1883|8883)([^0-9]|$)|mosquitto|cmagent' 2>/dev/null             | sed 's#^root/##' > ../results/fu_8-mqtt-static-port-service-crossref.txt || true

          # Firewall mutation primitives referencing MQTT or those ports only.
          find root/etc root/usr/lib root/usr/sbin root/usr/bin -type f -print0 2>/dev/null             | xargs -0 -r grep -IanE '(iptables|ip6tables|fw3|firewall|uci (add|set|delete)|ubus call firewall|reload_config).*?(1883|8883|mosquitto|cmagent)|(1883|8883|mosquitto|cmagent).*?(iptables|ip6tables|fw3|firewall|uci (add|set|delete)|ubus call firewall|reload_config)' 2>/dev/null             | sed 's#^root/##' > ../results/fu_8-mqtt-firewall-mutator-crossref.txt || true

          # Extract zone defaults and rules into a compact evidence table.
          python3 - <<'PY'
          from pathlib import Path
          import re,csv,json
          fw=Path('root/etc/config/firewall').read_text(errors='replace')

          sections=[]
          current=None
          for raw in fw.splitlines():
              line=raw.strip()
              m=re.match(r"config\s+(\S+)(?:\s+'([^']*)')?", line)
              if m:
                  current={'type':m.group(1),'name':m.group(2) or '', 'options':{}}
                  sections.append(current)
                  continue
              m=re.match(r"option\s+(\S+)\s+'([^']*)'", line)
              if m and current:
                  current['options'][m.group(1)] = m.group(2)

          zones=[]
          mqtt_rules=[]
          for s in sections:
              if s['type']=='zone':
                  zones.append({
                      'name':s['options'].get('name',''),
                      'input':s['options'].get('input',''),
                      'output':s['options'].get('output',''),
                      'forward':s['options'].get('forward',''),
                      'network':s['options'].get('network',''),
                  })
              if s['type'] in ('rule','redirect'):
                  o=s['options']
                  blob=' '.join([s['name']]+list(o.keys())+list(o.values())).lower()
                  if any(x in blob for x in ['1883','8883','mosquitto','cmagent']):
                      mqtt_rules.append({'type':s['type'],'name':s['name'],**o})

          with open('../results/fu_8-firewall-zones.csv','w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=['name','input','output','forward','network'])
              w.writeheader(); w.writerows(zones)
          with open('../results/fu_8-mqtt-explicit-firewall-rules.json','w') as f:
              json.dump(mqtt_rules,f,indent=2,sort_keys=True)

          wan=[z for z in zones if z['name']=='wan']
          lan=[z for z in zones if z['name']=='lan']
          refs=Path('../results/fu_8-mqtt-firewall-mutator-crossref.txt').read_text(errors='replace')
          with open('../results/fu_8-mqtt-firewall-summary.txt','w') as f:
              f.write(f"WAN_ZONE_FOUND={bool(wan)}\n")
              if wan:
                  f.write(f"WAN_INPUT={wan[0]['input']}\nWAN_FORWARD={wan[0]['forward']}\nWAN_OUTPUT={wan[0]['output']}\n")
              f.write(f"LAN_ZONE_FOUND={bool(lan)}\n")
              if lan:
                  f.write(f"LAN_INPUT={lan[0]['input']}\n")
              f.write(f"EXPLICIT_MQTT_FIREWALL_RULE_COUNT={len(mqtt_rules)}\n")
              f.write(f"STATIC_MQTT_FIREWALL_MUTATOR_REFERENCE_FOUND={bool(refs.strip())}\n")
              f.write("INTERPRETATION=Listener bind address is separate from firewall reachability. This audit proves only static stock policy and static mutation evidence.\n")
          PY

          # Sanitize binary/noise lines from crossrefs to keep evidence readable.
          for f in ../results/fu_8-mqtt-static-port-service-crossref.txt ../results/fu_8-mqtt-firewall-mutator-crossref.txt; do
            python3 - "$f" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1])
          out=[]
          for line in p.read_text(errors='replace').splitlines():
              if '\x00' in line: continue
              if len(line)>1000: continue
              out.append(line)
          p.write_text('\n'.join(out)+('\n' if out else ''))
          PY
          done

          echo "R25_MQTT_FIREWALL_EXPOSURE_STATIC=PASS" > ../results/fu_8-result.txt
          find ../results -type f -print0 | sort -z | xargs -0 sha256sum > ../results/fu_8-results-sha256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fu_8-R25-MQTT-FIREWALL-EXPOSURE
          path: fu_8-R25-MQTT-FIREWALL-EXPOSURE/results
          compression-level: 6
