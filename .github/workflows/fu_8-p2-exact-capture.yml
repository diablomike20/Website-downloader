name: fu_8 P2 exact stable beta capture

on:
  push:
    branches:
      - fu_6-cudy-forensic
    paths:
      - ".github/workflows/fu_8-p2-exact-capture.yml"

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Recover exact first-party and community URLs
        shell: bash
        run: |
          set -euo pipefail
          OUT="fu_8-P2-EXACT-CAPTURE"
          mkdir -p "$OUT"
          cd "$OUT"

          FORUM="https://www.cudyforum.it/d/30-p2-5g-router-wifi-6-ax3000"
          CUDY="https://www.cudy.com/en-oc/pages/download-center/p2-1-0"

          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o forum.html "$FORUM"
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o cudy.html "$CUDY"

          grep -oE 'https://mega\.nz/file/qNgxhC6I#[A-Za-z0-9_-]+' forum.html | sort -u > fu_8-beta-mega-links.txt || true
          grep -oE 'href="[^"]*P2-R91-2\.4\.29-20260421-190344-sysupgrade\.zip[^"]*"' cudy.html | sed -E 's/^href="//;s/"$//' | sort -u > fu_8-stable-hrefs.txt || true
          grep -oE 'https?://[^"[:space:]<>]*P2-R91-2\.4\.29-20260421-190344-sysupgrade\.zip[^"[:space:]<>]*' cudy.html | sort -u >> fu_8-stable-hrefs.txt || true
          sort -u -o fu_8-stable-hrefs.txt fu_8-stable-hrefs.txt

          echo "=== beta MEGA exact ===" > fu_8-link-report.txt
          cat fu_8-beta-mega-links.txt >> fu_8-link-report.txt || true
          echo "=== stable hrefs exact ===" >> fu_8-link-report.txt
          cat fu_8-stable-hrefs.txt >> fu_8-link-report.txt || true

          STABLE=""
          while IFS= read -r href; do
            [ -z "$href" ] && continue
            case "$href" in
              http*) STABLE="$href" ;;
              //*) STABLE="https:$href" ;;
              /*) STABLE="https://www.cudy.com$href" ;;
              *) STABLE="https://www.cudy.com/$href" ;;
            esac
            break
          done < fu_8-stable-hrefs.txt

          if [ -n "$STABLE" ]; then
            echo "STABLE_URL=$STABLE" | tee fu_8-stable-url.txt
            if curl -L --fail --retry 3 -o fu_8-P2-R91-2.4.29-stable.zip "$STABLE"; then
              sha256sum fu_8-P2-R91-2.4.29-stable.zip > fu_8-stable-sha256.txt
              md5sum fu_8-P2-R91-2.4.29-stable.zip > fu_8-stable-md5.txt
              stat -c 'STABLE_BYTES=%s' fu_8-P2-R91-2.4.29-stable.zip > fu_8-stable-size.txt
              file fu_8-P2-R91-2.4.29-stable.zip > fu_8-stable-file.txt
              unzip -t fu_8-P2-R91-2.4.29-stable.zip > fu_8-stable-unzip-test.txt 2>&1 || true
              mkdir stable-extracted
              unzip -o fu_8-P2-R91-2.4.29-stable.zip -d stable-extracted >/dev/null || true
              find stable-extracted -type f -print0 | sort -z | xargs -0 -r sha256sum > fu_8-stable-inner-sha256.txt
            else
              echo "STABLE_DOWNLOAD=FAIL" > fu_8-stable-result.txt
            fi
          else
            echo "STABLE_URL_NOT_RECOVERED" > fu_8-stable-result.txt
          fi

          BETA=$(head -1 fu_8-beta-mega-links.txt || true)
          if [ -n "$BETA" ]; then
            echo "BETA_MEGA_URL=$BETA" | tee fu_8-beta-url.txt
            sudo apt-get update -qq
            if sudo apt-get install -y -qq megatools; then
              mkdir beta-download
              if megadl --path=beta-download "$BETA"; then
                find beta-download -type f -print0 | sort -z | xargs -0 -r sha256sum > fu_8-beta-sha256.txt
                find beta-download -type f -printf '%P\t%s\n' | sort > fu_8-beta-files.txt
                for f in beta-download/*; do
                  [ -f "$f" ] || continue
                  file "$f" >> fu_8-beta-filetypes.txt
                  case "$f" in
                    *.zip) unzip -t "$f" >> fu_8-beta-unzip-test.txt 2>&1 || true ;;
                  esac
                done
                echo "BETA_DOWNLOAD=PASS" > fu_8-beta-result.txt
              else
                echo "BETA_DOWNLOAD=FAIL" > fu_8-beta-result.txt
              fi
            else
              echo "MEGATOOLS_INSTALL=FAIL" > fu_8-beta-result.txt
            fi
          else
            echo "BETA_FULL_MEGA_URL_NOT_RECOVERED" > fu_8-beta-result.txt
          fi

          sha256sum forum.html cudy.html > fu_8-source-page-sha256.txt
          echo "P2_EXACT_CAPTURE_DONE" > fu_8-result.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fu_8-P2-EXACT-CAPTURE
          path: fu_8-P2-EXACT-CAPTURE
          compression-level: 0
          include-hidden-files: true
