name: FU_7 Download CudyForum P2 Dev Betas
on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - ".github/workflows/fu_7-download-cudyforum-p2-dev.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install MEGA downloader
        run: |
          sudo apt-get update
          sudo apt-get install -y megatools

      - name: Extract full MEGA links and download all P2 dev/support packages
        shell: bash
        run: |
          set -e
          mkdir -p fu_7-CUDYFORUM-P2-DEV
          python3 - <<'PY'
          import re,urllib.request,html,json
          u="https://www.cudyforum.it/d/30-p2-5g-router-wifi-6-ax3000"
          req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0 OpenCudy-FU7"})
          body=urllib.request.urlopen(req,timeout=40).read().decode("utf-8","replace")
          body=html.unescape(body)
          links=[]
          for m in re.finditer(r'https://mega\.nz/(?:file|folder)/[A-Za-z0-9_-]+#[A-Za-z0-9_-]+',body):
              x=m.group(0)
              if x not in links: links.append(x)
          print(json.dumps(links,indent=2))
          open("fu_7-CUDYFORUM-P2-MEGA-LINKS.json","w").write(json.dumps(links,indent=2))
          if not links:
              raise SystemExit("No MEGA links recovered from raw forum HTML")
          PY

          python3 - <<'PY' > /tmp/links.txt
          import json
          for x in json.load(open("fu_7-CUDYFORUM-P2-MEGA-LINKS.json")):
              print(x)
          PY

          n=0
          while IFS= read -r url; do
            n=$((n+1))
            mkdir -p "fu_7-CUDYFORUM-P2-DEV/link-$n"
            echo "DOWNLOADING $n $url"
            megadl --path="fu_7-CUDYFORUM-P2-DEV/link-$n" "$url" || true
          done < /tmp/links.txt

          count=$(find fu_7-CUDYFORUM-P2-DEV -type f | wc -l)
          echo "downloaded_files=$count"
          test "$count" -gt 0

      - name: Build manifest
        run: |
          python3 - <<'PY'
          import os,hashlib,csv,json
          root="fu_7-CUDYFORUM-P2-DEV"
          rows=[]
          for dp,_,fs in os.walk(root):
              for fn in fs:
                  p=os.path.join(dp,fn)
                  h=hashlib.sha256()
                  with open(p,"rb") as f:
                      for c in iter(lambda:f.read(1024*1024),b""):h.update(c)
                  rows.append({"path":os.path.relpath(p,root),"size":os.path.getsize(p),"sha256":h.hexdigest()})
          rows.sort(key=lambda x:x["path"].lower())
          with open("fu_7-CUDYFORUM-P2-DEV-MANIFEST.csv","w",newline="",encoding="utf-8") as f:
              w=csv.DictWriter(f,fieldnames=["path","size","sha256"]);w.writeheader();w.writerows(rows)
          json.dump(rows,open("fu_7-CUDYFORUM-P2-DEV-MANIFEST.json","w"),indent=2)
          print(json.dumps(rows,indent=2))
          PY
          zip -r -9 fu_7-CUDYFORUM-P2-DEV.zip fu_7-CUDYFORUM-P2-DEV fu_7-CUDYFORUM-P2-DEV-MANIFEST.* fu_7-CUDYFORUM-P2-MEGA-LINKS.json

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fu_7-CUDYFORUM-P2-DEV
          retention-days: 30
          if-no-files-found: error
          path: |
            fu_7-CUDYFORUM-P2-DEV.zip
            fu_7-CUDYFORUM-P2-DEV-MANIFEST.csv
            fu_7-CUDYFORUM-P2-DEV-MANIFEST.json
            fu_7-CUDYFORUM-P2-MEGA-LINKS.json
