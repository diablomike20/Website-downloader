name: FU_7 Beta Marker Context Map

on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - ".github/workflows/fu_7-beta-marker-context-map.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild marker map and print compact contexts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fu_7_cudy_beta_version_markers.py >/dev/null
          python3 - <<'PY'
          import csv,json,re
          targets={
            "2.3.11beta","2.3.12beta","2.5.0b","2.5.1b","2.5.4b",
            "2.5.10b","2.5.10b-20260624-151245","2.5.11b",
            "2.5.14b","2.5.16b","2.5.28b"
          }
          rows=[]
          with open("fu_7-CUDY-BETA-VERSION-HITS.csv",encoding="utf-8") as f:
              for r in csv.DictReader(f):
                  if r["marker"].lower() not in targets: continue
                  ctx=re.sub(r'\s+',' ',r["context"])
                  rows.append({
                    "marker":r["marker"],"source":r["source"],"page":r["page"],
                    "models":r["models"],"context":ctx[:2200]
                  })
          print(json.dumps(rows,indent=2,ensure_ascii=False))
          open("fu_7-BETA-MARKER-CONTEXT-MAP.json","w",encoding="utf-8").write(json.dumps(rows,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fu_7-BETA-MARKER-CONTEXT-MAP
          retention-days: 30
          path: fu_7-BETA-MARKER-CONTEXT-MAP.json
