name: FU_7 CommonCrawl Raw Leak Recovery

on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - ".github/workflows/fu_7-commoncrawl-raw-leak-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Recover raw links from Common Crawl WARC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered evidence
          python3 - <<'PY'
          import gzip,io,json,os,re,hashlib,urllib.parse,urllib.request

          UA="Mozilla/5.0 OpenCudy-FU7-CommonCrawl"
          targets=[
            {
              "tag":"WR3600H-2311",
              "page":"https://4pda.to/forum/index.php?showtopic=1103718&st=180",
              "needle":"R69-2.3.11Beta-20250429-100114-sysupgrade",
            },
            {
              "tag":"WR3600H-2315",
              "page":"https://4pda.to/forum/index.php?showtopic=1103718&st=380",
              "needle":"WR3600H-R69-2.3.15Beta-20250916-202013-sysupgrade",
            },
            {
              "tag":"WR6500H-beta",
              "page":"https://4pda.to/forum/index.php?showtopic=1104836&st=260",
              "needle":"1EN12-4KNFeSc2M3v",
            },
          ]

          def get(url,timeout=70,headers=None):
              h={"User-Agent":UA,"Accept":"*/*"}
              if headers:h.update(headers)
              req=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.read(),r.status,dict(r.headers)

          coll=json.loads(get("https://index.commoncrawl.org/collinfo.json",40)[0].decode())
          indexes=[x["id"] for x in coll if x["id"].startswith(("CC-MAIN-2025-","CC-MAIN-2026-"))]
          results=[]; candidate_links=[]

          def add_link(tag,u,source):
              u=u.replace("&amp;","&").replace("\\u0026","&")
              if u.startswith("//"):u="https:"+u
              key=(tag,u)
              if key not in {(x["tag"],x["url"]) for x in candidate_links}:
                  candidate_links.append({"tag":tag,"url":u,"source":source})

          for t in targets:
              page=t["page"]; tag=t["tag"]; needle=t["needle"]
              variants=[
                page,
                page.replace("https://4pda.to","http://4pda.to"),
                page.replace("4pda.to","4pda.ru"),
              ]
              records=[]
              for idx in indexes:
                  for v in variants:
                      q=urllib.parse.urlencode({"url":v,"output":"json"})
                      try:
                          b,_,_=get(f"https://index.commoncrawl.org/{idx}-index?{q}",25)
                      except:continue
                      for ln in b.decode("utf-8","replace").splitlines():
                          try:o=json.loads(ln)
                          except:continue
                          if o.get("status")=="200" and o.get("filename") and o.get("offset") and o.get("length"):
                              o["_index"]=idx
                              records.append(o)
              # dedup WARC coordinates
              uniq={}
              for o in records:uniq[(o["filename"],o["offset"],o["length"])]=o
              records=list(uniq.values())
              print(tag,"CC_RECORDS",len(records))

              for ri,o in enumerate(records,1):
                  start=int(o["offset"]); length=int(o["length"])
                  end=start+length-1
                  warcurl="https://data.commoncrawl.org/"+o["filename"]
                  try:
                      b,st,h=get(warcurl,70,{"Range":f"bytes={start}-{end}"})
                  except Exception as e:
                      results.append({"tag":tag,"stage":"warc","url":warcurl,"error":repr(e)});continue
                  # response may be gzip member
                  try:
                      raw=gzip.decompress(b)
                  except:
                      try:
                          raw=gzip.GzipFile(fileobj=io.BytesIO(b)).read()
                      except:raw=b
                  txt=raw.decode("utf-8","replace")
                  low=txt.lower()
                  if needle.lower() in low or (tag=="WR6500H-beta" and "drive.google" in low):
                      p=low.find(needle.lower())
                      if p<0:p=low.find("drive.google")
                      frag=txt[max(0,p-15000):p+20000]
                      fn=f"evidence/{tag}-{o['_index']}-{ri}.txt"
                      open(fn,"w",encoding="utf-8").write(frag)
                      # href/src/raw URL extraction
                      for m in re.finditer(r'(?i)(?:href|src)=["\']([^"\']+)["\']',frag):
                          u=urllib.parse.urljoin(page,urllib.parse.unquote(m.group(1)))
                          if "/forum/dl/post/" in u or "drive.google.com" in u or needle.lower() in u.lower():
                              add_link(tag,u,f"COMMONCRAWL:{o['_index']}")
                      for m in re.finditer(r'(?i)https?://[^"\'<>\s]+',frag):
                          u=urllib.parse.unquote(m.group(0))
                          if "/forum/dl/post/" in u or "drive.google.com" in u or needle.lower() in u.lower():
                              add_link(tag,u,f"COMMONCRAWL:{o['_index']}")
                      results.append({"tag":tag,"stage":"warc_hit","index":o["_index"],"url":o.get("url"),"digest":o.get("digest"),"evidence":fn})

          # expand Google Drive candidates
          for x in list(candidate_links):
              u=x["url"]
              if "drive.google.com" in u:
                  m=re.search(r'/file/d/([^/]+)',u)
                  if not m:m=re.search(r'[?&]id=([^&]+)',u)
                  if m:
                      fid=m.group(1)
                      add_link(x["tag"],f"https://drive.usercontent.google.com/download?id={fid}&export=download&confirm=t","DRIVE_DIRECT:"+x["source"])
                      add_link(x["tag"],f"https://drive.google.com/uc?export=download&id={fid}&confirm=t","DRIVE_UC:"+x["source"])

          # download any candidate that resolves to non-html payload >1 MB
          downloads=[]
          for x in candidate_links:
              u=x["url"];tag=x["tag"]
              try:
                  data,st,h=get(u,120)
                  sha=hashlib.sha256(data).hexdigest()
                  htmlish=b"<html" in data[:1500].lower() or b"<!doctype" in data[:1500].lower()
                  rec={**x,"status":st,"size":len(data),"sha256":sha,"content_type":h.get("Content-Type",""),"htmlish":htmlish}
                  if len(data)>1_000_000 and not htmlish:
                      cd=h.get("Content-Disposition","")
                      name=""
                      mm=re.search(r'filename\*?=(?:UTF-8\'\')?["\']?([^;"\']+)',cd,re.I)
                      if mm:name=urllib.parse.unquote(mm.group(1).strip())
                      if not name:
                          name=urllib.parse.unquote(urllib.parse.urlsplit(u).path.rsplit("/",1)[-1])
                      if not name or "." not in name:name=tag+"-"+sha[:8]+".bin"
                      name=re.sub(r'[^A-Za-z0-9._()+ -]+','_',name)
                      out="recovered/"+name
                      if os.path.exists(out):out="recovered/"+sha[:8]+"-"+name
                      open(out,"wb").write(data);rec["saved_as"]=out
                      print("SAVED",tag,out,len(data),sha,u)
                  downloads.append(rec)
              except Exception as e:
                  downloads.append({**x,"error":repr(e)})

          summary={"candidate_links":candidate_links,"downloads":downloads,"warc_results":results}
          json.dump(summary,open("fu_7-COMMONCRAWL-RAW-LEAK-RECOVERY.json","w"),indent=2,ensure_ascii=False)
          print(json.dumps({"links":candidate_links,"saved":[x for x in downloads if x.get("saved_as")]},indent=2,ensure_ascii=False))
          PY

      - name: Upload recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fu_7-COMMONCRAWL-RAW-LEAK-RECOVERY
          retention-days: 30
          if-no-files-found: warn
          path: |
            recovered/*
            fu_7-COMMONCRAWL-RAW-LEAK-RECOVERY.json
            evidence/*
