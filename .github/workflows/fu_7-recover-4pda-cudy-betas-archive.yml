name: FU_7 Recover 4PDA Cudy Betas via Archive
on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - ".github/workflows/fu_7-recover-4pda-cudy-betas-archive.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Recover attachment URLs and archived binaries
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import os,re,json,html,csv,hashlib,urllib.parse,urllib.request

          UA="Mozilla/5.0 OpenCudy-FU7-4PDA-Archive"
          TARGETS=[
            {
              "marker":"R69-2.3.11Beta-20250429-100114-sysupgrade.zip",
              "page":"https://4pda.to/forum/index.php?showtopic=1103718&st=180"
            },
            {
              "marker":"WR3600H-R69-2.3.15Beta-20250916-202013-sysupgrade.zip",
              "page":"https://4pda.to/forum/index.php?showtopic=1103718&st=380"
            },
          ]
          def fetch(u,timeout=90):
            req=urllib.request.Request(u,headers={"User-Agent":UA,"Accept":"*/*"})
            with urllib.request.urlopen(req,timeout=timeout) as r:
              return r.read(),r.status,dict(r.headers)

          outdir="fu_7-4PDA-CUDY-BETA-RECOVERED"
          os.makedirs(outdir,exist_ok=True)
          rows=[]
          for t in TARGETS:
            marker=t["marker"];page=t["page"]
            params=[
              ("url",page),("output","json"),
              ("fl","timestamp,original,statuscode,digest"),
              ("filter","statuscode:200"),("collapse","digest")
            ]
            try:
              b,_,_=fetch("https://web.archive.org/cdx/search/cdx?"+urllib.parse.urlencode(params),120)
              d=json.loads(b.decode("utf-8","replace"))
            except Exception as e:
              rows.append({"marker":marker,"source":"","result":"PAGE_CDX_FAIL:"+repr(e),"size":"","sha256":"","saved_as":""});continue
            snaps=[]
            if d:
              h=d[0];snaps=[dict(zip(h,r)) for r in d[1:]]
            print("SNAPS",marker,len(snaps))
            attach=[]
            for s in snaps:
              ts=s.get("timestamp","")
              if not ts:continue
              arch=f"https://web.archive.org/web/{ts}id_/{page}"
              try:body,_,_=fetch(arch,70)
              except:continue
              txt=html.unescape(body.decode("utf-8","replace"))
              if marker.lower() not in txt.lower():continue
              pos=txt.lower().find(marker.lower())
              frag=txt[max(0,pos-8000):pos+8000]
              for m in re.finditer(r'href=["\']([^"\']+)["\']',frag,re.I):
                href=html.unescape(m.group(1))
                full=urllib.parse.urljoin(page,href)
                if "/forum/dl/post/" in full or marker.lower() in full.lower():
                  attach.append((ts,full))
              # Direct textual dl URLs.
              for m in re.finditer(r'(?i)(?://4pda\.to)?/forum/dl/post/\d+/[^"\'<>\s]+',frag):
                attach.append((ts,urllib.parse.urljoin(page,m.group(0))))
            # unique
            seen=set();attach=[x for x in attach if not ((x[0],x[1]) in seen or seen.add((x[0],x[1])))]
            print("ATTACH",marker,attach)
            saved=False
            for ts,u in attach:
              candidates=[u,f"https://web.archive.org/web/{ts}id_/{u}"]
              # attachment URL own archive history
              params=[("url",u),("output","json"),("fl","timestamp,original,statuscode"),("filter","statuscode:200")]
              try:
                bb,_,_=fetch("https://web.archive.org/cdx/search/cdx?"+urllib.parse.urlencode(params),70)
                dd=json.loads(bb.decode("utf-8","replace"))
                if dd:
                  hh=dd[0]
                  for rr in dd[1:]:
                    oo=dict(zip(hh,rr));tt=oo.get("timestamp","");orig=oo.get("original","")
                    if tt and orig:candidates.append(f"https://web.archive.org/web/{tt}id_/{orig}")
              except:pass
              for cu in candidates:
                try:data,st,h=fetch(cu,120)
                except Exception as e:
                  rows.append({"marker":marker,"source":cu,"result":"FAIL","size":"","sha256":"","saved_as":""});continue
                sha=hashlib.sha256(data).hexdigest()
                head=data[:1024].lower()
                if len(data)<1024 or b"<html" in head or b"<!doctype" in head:
                  rows.append({"marker":marker,"source":cu,"result":"NON_BINARY","size":len(data),"sha256":sha,"saved_as":""});continue
                fn=marker
                p=os.path.join(outdir,fn)
                if os.path.exists(p):p=os.path.join(outdir,sha[:8]+"-"+fn)
                open(p,"wb").write(data)
                rows.append({"marker":marker,"source":cu,"result":"SAVED","size":len(data),"sha256":sha,"saved_as":os.path.basename(p)})
                print("SAVED",marker,len(data),sha,cu)
                saved=True;break
              if saved:break
            if not saved:print("NOT_RECOVERED",marker)
          fields=["marker","source","result","size","sha256","saved_as"]
          with open("fu_7-4PDA-CUDY-BETA-RECOVERY-MANIFEST.csv","w",newline="",encoding="utf-8") as f:
            w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(rows)
          summary={"saved":[r for r in rows if r["result"]=="SAVED"],"targets":[x["marker"] for x in TARGETS]}
          json.dump(summary,open("fu_7-4PDA-CUDY-BETA-RECOVERY-SUMMARY.json","w"),indent=2,ensure_ascii=False)
          print(json.dumps(summary,indent=2,ensure_ascii=False))
          PY

      - name: Pack
        if: always()
        run: |
          zip -r -9 fu_7-4PDA-CUDY-BETA-RECOVERY.zip             fu_7-4PDA-CUDY-BETA-RECOVERED             fu_7-4PDA-CUDY-BETA-RECOVERY-MANIFEST.csv             fu_7-4PDA-CUDY-BETA-RECOVERY-SUMMARY.json || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fu_7-4PDA-CUDY-BETA-RECOVERY
          retention-days: 30
          if-no-files-found: warn
          path: |
            fu_7-4PDA-CUDY-BETA-RECOVERY.zip
            fu_7-4PDA-CUDY-BETA-RECOVERY-MANIFEST.csv
            fu_7-4PDA-CUDY-BETA-RECOVERY-SUMMARY.json
