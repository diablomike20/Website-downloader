name: FU_7 Cudy Beta Version Marker Hunt
on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - "scripts/fu_7_cudy_beta_version_markers.py"
      - ".github/workflows/fu_7-cudy-beta-version-markers.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Harvest private beta version markers
        run: python3 scripts/fu_7_cudy_beta_version_markers.py
      - name: Summary
        if: always()
        run: cat fu_7-CUDY-BETA-VERSION-SUMMARY.json || true
      - name: Pack
        if: always()
        run: |
          zip -9 fu_7-CUDY-BETA-VERSION-HUNT.zip             fu_7-CUDY-BETA-VERSION-HITS.csv             fu_7-CUDY-BETA-VERSION-MARKERS.csv             fu_7-CUDY-BETA-VERSION-ARCHIVE.csv             fu_7-CUDY-BETA-VERSION-SUMMARY.json || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fu_7-CUDY-BETA-VERSION-HUNT
          retention-days: 30
          if-no-files-found: warn
          path: |
            fu_7-CUDY-BETA-VERSION-HUNT.zip
            fu_7-CUDY-BETA-VERSION-HITS.csv
            fu_7-CUDY-BETA-VERSION-MARKERS.csv
            fu_7-CUDY-BETA-VERSION-ARCHIVE.csv
            fu_7-CUDY-BETA-VERSION-SUMMARY.json
