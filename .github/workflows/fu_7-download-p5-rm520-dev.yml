name: FU_7 Download P5 RM520 Dev Package
on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - ".github/workflows/fu_7-download-p5-rm520-dev.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve and download MediaFire support package
        shell: bash
        run: |
          set -e
          mkdir -p fu_7-P5-RM520-DEV
          python3 - <<'PY'
          import re,html,urllib.request,os
          page="https://www.mediafire.com/file/8h45jt668wlxx06/Upgrade_RM520.zip/file"
          req=urllib.request.Request(page,headers={"User-Agent":"Mozilla/5.0 OpenCudy-FU7"})
          body=urllib.request.urlopen(req,timeout=40).read().decode("utf-8","replace")
          # MediaFire direct button href
          pats=[
            r'id=["\']downloadButton["\'][^>]*href=["\']([^"\']+)',
            r'href=["\']([^"\']+)["\'][^>]*id=["\']downloadButton',
            r'(https://download[^"\']+\.mediafire\.com/[^"\']+)',
          ]
          links=[]
          for pat in pats:
              for m in re.finditer(pat,body,re.I):
                  u=html.unescape(m.group(1) if m.lastindex else m.group(0))
                  if u not in links:links.append(u)
          print("LINKS",links)
          if not links: raise SystemExit("No MediaFire direct link found")
          u=links[0]
          req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0 OpenCudy-FU7","Referer":page})
          with urllib.request.urlopen(req,timeout=120) as r:
              data=r.read()
              cd=r.headers.get("Content-Disposition","")
          fn="Upgrade_RM520.zip"
          m=re.search(r'filename\*?=(?:UTF-8\'\')?["\']?([^;"\']+)',cd,re.I)
          if m:fn=urllib.parse.unquote(m.group(1).strip())
          open("fu_7-P5-RM520-DEV/"+fn,"wb").write(data)
          print("SAVED",fn,len(data))
          PY

      - name: Extract and hash all files
        shell: bash
        run: |
          set -e
          mkdir -p fu_7-P5-RM520-DEV/extracted
          archive=$(find fu_7-P5-RM520-DEV -maxdepth 1 -type f -name '*.zip' | head -1)
          unzip -o "$archive" -d fu_7-P5-RM520-DEV/extracted
          python3 - <<'PY'
          import os,hashlib,csv,json
          root="fu_7-P5-RM520-DEV"
          rows=[]
          for dp,_,fs in os.walk(root):
              for fn in fs:
                  p=os.path.join(dp,fn)
                  h=hashlib.sha256()
                  with open(p,"rb") as f:
                      for c in iter(lambda:f.read(1024*1024),b""):h.update(c)
                  rows.append({"path":os.path.relpath(p,root),"size":os.path.getsize(p),"sha256":h.hexdigest()})
          rows.sort(key=lambda x:x["path"].lower())
          with open("fu_7-P5-RM520-DEV-MANIFEST.csv","w",newline="",encoding="utf-8") as f:
              w=csv.DictWriter(f,fieldnames=["path","size","sha256"]);w.writeheader();w.writerows(rows)
          json.dump(rows,open("fu_7-P5-RM520-DEV-MANIFEST.json","w"),indent=2)
          print(json.dumps(rows,indent=2))
          PY
          zip -r -9 fu_7-P5-RM520-DEV-COLLECTION.zip fu_7-P5-RM520-DEV fu_7-P5-RM520-DEV-MANIFEST.*

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fu_7-P5-RM520-DEV
          retention-days: 30
          if-no-files-found: error
          path: |
            fu_7-P5-RM520-DEV-COLLECTION.zip
            fu_7-P5-RM520-DEV-MANIFEST.csv
            fu_7-P5-RM520-DEV-MANIFEST.json
