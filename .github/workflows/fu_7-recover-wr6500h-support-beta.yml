name: FU_7 Recover WR6500H Support Beta

on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - ".github/workflows/fu_7-recover-wr6500h-support-beta.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Recover WR6500H support beta Drive file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered evidence
          python3 - <<'PY'
          import os,re,json,hashlib,urllib.parse,urllib.request
          UA="Mozilla/5.0 OpenCudy-FU7-WR6500H"
          page="https://4pda.to/forum/index.php?showtopic=1104836&st=260"
          needle="1EN12-4KNFeSc2M3v"
          candidates=[]; evidence=[]

          def get(url,timeout=50):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"*/*","Accept-Language":"en-US,en;q=0.9"})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.read(),r.status,dict(r.headers)

          def add(u,why):
              u=u.replace("&amp;","&")
              if u not in [x[0] for x in candidates]:
                  candidates.append((u,why))

          # Direct/alternate 4PDA renderings.
          for u in [
              page,
              page+"&view=print",
              page+"&output=1",
              "https://4pda.to/forum/lofiversion/index.php?t1104836-260.html",
          ]:
              try:
                  b,st,h=get(u,35); txt=b.decode("utf-8","replace")
                  evidence.append({"source":u,"status":st,"length":len(b),"needle":needle in txt})
                  for m in re.finditer(r'https?://drive\.google\.com/[^"\'<>\s]+',txt,re.I):
                      if needle in m.group(0): add(m.group(0),"4PDA_PAGE")
                  # Links may be encoded in href params.
                  for m in re.finditer(r'href=["\']([^"\']+)["\']',txt,re.I):
                      href=urllib.parse.unquote(m.group(1))
                      if "drive.google.com" in href and needle in href:add(href,"4PDA_HREF")
              except Exception as e:
                  evidence.append({"source":u,"error":repr(e)})

          # Search engine results often preserve complete outbound URL.
          q='"'+needle+'"'
          for eng in [
              "https://www.google.com/search?q="+urllib.parse.quote(q),
              "https://www.bing.com/search?q="+urllib.parse.quote(q),
              "https://html.duckduckgo.com/html/?q="+urllib.parse.quote(q),
          ]:
              try:
                  b,st,h=get(eng,40); txt=b.decode("utf-8","replace")
                  open("evidence/search-"+str(len(evidence))+".html","w",encoding="utf-8").write(txt)
                  # Decode URL params repeatedly.
                  probes=[txt,urllib.parse.unquote(txt),urllib.parse.unquote_plus(txt)]
                  for probe in probes:
                      for m in re.finditer(r'https?://drive\.google\.com/[^"\'<>\s&]+',probe,re.I):
                          u=m.group(0)
                          if needle in u:add(u,"SEARCH_ENGINE")
                  evidence.append({"source":eng,"status":st,"length":len(b)})
              except Exception as e:evidence.append({"source":eng,"error":repr(e)})

          # Wayback snapshots of the 4PDA page.
          try:
              p=urllib.parse.urlencode([
                  ("url",page),("output","json"),
                  ("fl","timestamp,original,statuscode,digest"),
                  ("filter","statuscode:200"),("from","2026"),("to","2026")
              ])
              b,_,_=get("https://web.archive.org/cdx/search/cdx?"+p,90)
              d=json.loads(b.decode("utf-8","replace"))
              if d:
                  h=d[0]
                  for row in d[1:]:
                      o=dict(zip(h,row));ts=o.get("timestamp","")
                      if not ts:continue
                      su=f"https://web.archive.org/web/{ts}id_/{page}"
                      try:
                          sb,_,_=get(su,45);stxt=sb.decode("utf-8","replace")
                          for m in re.finditer(r'https?://drive\.google\.com/[^"\'<>\s]+',stxt,re.I):
                              if needle in m.group(0):add(m.group(0),"WAYBACK_PAGE")
                      except:pass
              evidence.append({"source":"wayback-page","rows":max(0,len(d)-1 if d else 0)})
          except Exception as e:evidence.append({"source":"wayback-page","error":repr(e)})

          # If we recover a file URL /view, try gdown-like direct URLs.
          expanded=[]
          for u,why in list(candidates):
              add(u,why)
              m=re.search(r'/file/d/([^/]+)',u)
              if m:
                  fid=m.group(1)
                  add(f"https://drive.usercontent.google.com/download?id={fid}&export=download&confirm=t","DRIVE_DIRECT")
                  add(f"https://drive.google.com/uc?export=download&id={fid}&confirm=t","DRIVE_UC")
              else:
                  m=re.search(r'[?&]id=([^&]+)',u)
                  if m:
                      fid=m.group(1)
                      add(f"https://drive.usercontent.google.com/download?id={fid}&export=download&confirm=t","DRIVE_DIRECT")

          results=[]
          for u,why in list(candidates):
              try:
                  data,st,h=get(u,120)
                  sha=hashlib.sha256(data).hexdigest()
                  htmlish=b"<html" in data[:1500].lower() or b"<!doctype" in data[:1500].lower()
                  cd=h.get("Content-Disposition","")
                  ct=h.get("Content-Type","")
                  rec={"url":u,"why":why,"status":st,"size":len(data),"sha256":sha,"content_type":ct,"htmlish":htmlish}
                  if len(data)>1024*1024 and not htmlish:
                      fn="WR6500H-support-beta-"+sha[:8]+".bin"
                      mm=re.search(r'filename\*?=(?:UTF-8\'\')?["\']?([^;"\']+)',cd,re.I)
                      if mm:fn=urllib.parse.unquote(mm.group(1).strip())
                      out=os.path.join("recovered",re.sub(r'[^A-Za-z0-9._()+ -]+','_',fn))
                      open(out,"wb").write(data);rec["saved_as"]=out
                      print("SAVED",out,len(data),sha,u)
                  results.append(rec)
              except Exception as e:
                  results.append({"url":u,"why":why,"error":repr(e)})

          json.dump({"needle":needle,"candidates":candidates,"results":results,"evidence":evidence},
                    open("fu_7-WR6500H-SUPPORT-BETA-RECOVERY.json","w"),indent=2,ensure_ascii=False)
          print(json.dumps({"candidates":candidates,"saved":[x for x in results if x.get("saved_as")]},indent=2,ensure_ascii=False))
          PY

      - name: Upload recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fu_7-WR6500H-SUPPORT-BETA-RECOVERY
          retention-days: 30
          if-no-files-found: warn
          path: |
            recovered/*
            fu_7-WR6500H-SUPPORT-BETA-RECOVERY.json
            evidence/*
