name: fu_8 R25 cmagent helper topology

on:
  push:
    branches:
      - fu_6-cudy-forensic
    paths:
      - ".github/workflows/fu_8-r25-cmagent-helper.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install extractor
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools >/dev/null
      - name: Capture exact helper sources
        shell: bash
        run: |
          set -euxo pipefail
          OUT="fu_8-R25-CMAGENT-HELPER-TOPOLOGY"
          mkdir -p "$OUT/results" "$OUT/work"
          cd "$OUT/work"
          curl -L --fail --retry 3 -o stock.bin "https://d1jvyy13vm72kv.cloudfront.net/device/upgrade/upgrade_LT500V2-R25-2.4.16-20250804-150319-flash_20729.bin"
          echo "57aed945a9f485d178d73a844e420fc2b441e60821e243d3d19d07dd4a3143d6  stock.bin" | sha256sum -c -
          tail -c "+2784590" stock.bin > rootfs.squashfs
          sudo unsquashfs -no-exit-code -d "$PWD/root" rootfs.squashfs >/dev/null 2>&1
          sudo chown -R "$(id -u):$(id -g)" root
          for p in usr/sbin/sync_command usr/sbin/sync_config; do
            test -f "root/$p"
            safe=$(echo "$p" | tr '/' '_')
            cp "root/$p" "../results/fu_8-source-$safe.txt"
            sha256sum "root/$p" > "../results/fu_8-$safe-sha256.txt"
          done
          find root -type f -print0 | xargs -0 -r grep -IanE 'sync_command|sync_config' 2>/dev/null | sed 's#^root/##' > ../results/fu_8-sync-helper-crossref.txt || true
          find root -type f -print0 | xargs -0 -r grep -IanE 'cmagent\.send\("router".*"router".*"command"' 2>/dev/null | sed 's#^root/##' > ../results/fu_8-router-command-callers.txt || true
          echo "R25_CMAGENT_HELPER_TOPOLOGY=PASS" > ../results/fu_8-result.txt
          find ../results -type f -print0 | sort -z | xargs -0 sha256sum > ../results/fu_8-results-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fu_8-R25-CMAGENT-HELPER-TOPOLOGY
          path: fu_8-R25-CMAGENT-HELPER-TOPOLOGY/results
          compression-level: 6
