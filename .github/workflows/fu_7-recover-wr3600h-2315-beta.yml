name: FU_7 Recover WR3600H 2.3.15 Beta

on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - ".github/workflows/fu_7-recover-wr3600h-2315-beta.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Recover exact WR3600H 2.3.15 beta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered evidence
          python3 - <<'PY'
          import os,re,json,hashlib,urllib.parse,urllib.request
          UA="Mozilla/5.0 OpenCudy-FU7-WR3600H-2315"
          target="WR3600H-R69-2.3.15Beta-20250916-202013-sysupgrade.zip"
          page="https://4pda.to/forum/index.php?showtopic=1103718&st=380"
          candidates=[]; evidence=[]

          def get(url,timeout=55):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"*/*","Accept-Language":"en-US,en;q=0.9"})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.read(),r.status,dict(r.headers)
          def add(u,why):
              if not u:return
              u=u.replace("&amp;","&")
              if u not in [x[0] for x in candidates]: candidates.append((u,why))

          forms=[
            page,page+"&view=print",page+"&output=1",
            "https://4pda.to/forum/lofiversion/index.php?t1103718-380.html",
            "https://4pda.ru/forum/index.php?showtopic=1103718&st=380",
            "https://4pda.ru/forum/lofiversion/index.php?t1103718-380.html",
          ]
          for u in forms:
              try:
                  b,st,h=get(u,35);t=b.decode("utf-8","replace")
                  evidence.append({"source":u,"status":st,"length":len(b),"target":target.lower() in t.lower()})
                  if target.lower() in t.lower():
                      i=t.lower().find(target.lower()); frag=t[max(0,i-10000):i+10000]
                      open(f"evidence/page-{len(evidence)}.html","w",encoding="utf-8").write(frag)
                      for m in re.finditer(r'href=["\']([^"\']+)["\']',frag,re.I):
                          href=urllib.parse.urljoin(u,urllib.parse.unquote(m.group(1)))
                          if target.lower() in href.lower() or "/forum/dl/post/" in href:add(href,"PAGE")
              except Exception as e:evidence.append({"source":u,"error":repr(e)})

          # Search engines with filename and attachment path hints.
          queries=[f'"{target}"',f'"{target}" "dl/post"',f'"{target}" 4pda']
          for q in queries:
              for base in [
                "https://www.google.com/search?q=",
                "https://www.bing.com/search?q=",
                "https://html.duckduckgo.com/html/?q="
              ]:
                  u=base+urllib.parse.quote(q)
                  try:
                      b,st,h=get(u,45);t=b.decode("utf-8","replace")
                      open(f"evidence/search-{len(evidence)}.html","w",encoding="utf-8").write(t)
                      for probe in [t,urllib.parse.unquote(t),urllib.parse.unquote_plus(t)]:
                          for m in re.finditer(r'https?://[^"\'<>\s&]+',probe,re.I):
                              x=m.group(0)
                              if target.lower() in x.lower() or ("4pda" in x.lower() and "/forum/dl/post/" in x.lower()):
                                  add(x,"SEARCH")
                      evidence.append({"source":u,"status":st,"length":len(b)})
                  except Exception as e:evidence.append({"source":u,"error":repr(e)})

          # Wayback direct filename and page snapshots on both 4pda domains.
          scopes=[
            "4pda.to/forum/dl/post/*/"+target,
            "4pda.ru/forum/dl/post/*/"+target,
            "4pda.to/forum/dl/post/*/*",
            "4pda.ru/forum/dl/post/*/*",
            "www.cudy.com/*"+target+"*",
            "cdn.shopify.com/*"+target+"*",
          ]
          for scope in scopes:
              try:
                  params=urllib.parse.urlencode([
                    ("url",scope),("output","json"),
                    ("fl","timestamp,original,statuscode,mimetype,digest,length"),
                    ("filter","statuscode:200")
                  ])
                  b,_,_=get("https://web.archive.org/cdx/search/cdx?"+params,100)
                  d=json.loads(b.decode("utf-8","replace"))
                  if d:
                      hdr=d[0]
                      for rr in d[1:]:
                          o=dict(zip(hdr,rr));orig=o.get("original","");ts=o.get("timestamp","")
                          if orig and target.lower() in orig.lower():
                              add(orig,"CDX_ORIGINAL")
                              if ts:add(f"https://web.archive.org/web/{ts}id_/{orig}","CDX_SNAPSHOT")
                  evidence.append({"source":"cdx:"+scope,"rows":max(0,len(d)-1 if d else 0)})
              except Exception as e:evidence.append({"source":"cdx:"+scope,"error":repr(e)})

          results=[]
          for u,why in candidates:
              try:
                  data,st,h=get(u,120);sha=hashlib.sha256(data).hexdigest()
                  htmlish=b"<html" in data[:1500].lower() or b"<!doctype" in data[:1500].lower()
                  rec={"url":u,"why":why,"status":st,"size":len(data),"sha256":sha,"type":h.get("Content-Type",""),"htmlish":htmlish}
                  if len(data)>5_000_000 and not htmlish:
                      out="recovered/"+target
                      if os.path.exists(out):out="recovered/"+sha[:8]+"-"+target
                      open(out,"wb").write(data);rec["saved_as"]=out
                      print("SAVED",out,len(data),sha,u)
                  results.append(rec)
              except Exception as e:results.append({"url":u,"why":why,"error":repr(e)})
          json.dump({"target":target,"candidates":candidates,"results":results,"evidence":evidence},
            open("fu_7-WR3600H-2315-BETA-RECOVERY.json","w"),indent=2,ensure_ascii=False)
          print(json.dumps({"target":target,"candidate_count":len(candidates),"saved":[r for r in results if r.get("saved_as")]},indent=2))
          PY
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fu_7-WR3600H-2315-BETA-RECOVERY
          retention-days: 30
          if-no-files-found: warn
          path: |
            recovered/*
            fu_7-WR3600H-2315-BETA-RECOVERY.json
            evidence/*
