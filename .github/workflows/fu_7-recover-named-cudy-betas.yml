name: FU_7 Recover Named Cudy Betas
on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - ".github/workflows/fu_7-recover-named-cudy-betas.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Recover exact named beta firmware from archive/current URLs
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import os, json, urllib.parse, urllib.request, hashlib, csv, re, time
          UA="OpenCudy-FU7-Beta-Recover/1.0"
          names=[
            "LT450-R9-1.15.5beta-20221121-180014-flash.bin",
            "LT500-R9-1.15.5beta-20221121-180014-flash.bin",
          ]
          scopes=[
            "www.cudy.com/*",
            "cudy.com/*",
            "cdn.shopify.com/s/files/1/0673/4748/0820/files/*",
          ]
          outdir="fu_7-RECOVERED-CUDY-BETAS"
          os.makedirs(outdir,exist_ok=True)
          rows=[]
          def fetch(url,timeout=60):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"*/*"})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.read(),r.status,dict(r.headers)
          def cdx(scope,name):
              params=[
                ("url",scope),("output","json"),
                ("fl","timestamp,original,statuscode,mimetype,digest,length"),
                ("filter","statuscode:200"),
                ("filter","original:.*"+re.escape(name)+".*"),
                ("collapse","urlkey"),
              ]
              u="https://web.archive.org/cdx/search/cdx?"+urllib.parse.urlencode(params)
              try:
                  b,_,_=fetch(u,120)
                  d=json.loads(b.decode("utf-8","replace"))
              except Exception as e:
                  return [],repr(e)
              if not d:return [],None
              h=d[0]
              return [dict(zip(h,x)) for x in d[1:]],None
          for name in names:
              hits=[]
              for scope in scopes:
                  rr,err=cdx(scope,name)
                  print("CDX",name,scope,len(rr),"ERR="+err if err else "")
                  hits.extend(rr)
              # unique archive hits
              seen=set()
              uniq=[]
              for h in hits:
                  k=(h.get("timestamp",""),h.get("original",""))
                  if k in seen:continue
                  seen.add(k);uniq.append(h)
              # also try likely current direct URLs
              candidates=[
                "https://www.cudy.com/cdn/shop/files/"+name,
                "https://cdn.shopify.com/s/files/1/0673/4748/0820/files/"+name,
              ]
              for h in uniq:
                  orig=h.get("original","")
                  ts=h.get("timestamp","")
                  if orig:
                      candidates.append(orig)
                      if ts:
                          candidates.append(f"https://web.archive.org/web/{ts}id_/{orig}")
              saved=False
              for u in candidates:
                  try:
                      data,st,headers=fetch(u,90)
                  except Exception as e:
                      rows.append({"filename":name,"source_url":u,"result":"FAIL:"+repr(e),"size":"","sha256":""})
                      continue
                  if len(data)<1024:
                      rows.append({"filename":name,"source_url":u,"result":"TOO_SMALL","size":len(data),"sha256":hashlib.sha256(data).hexdigest()})
                      continue
                  # reject obvious HTML/error pages
                  head=data[:512].lower()
                  if b"<html" in head or b"<!doctype html" in head:
                      rows.append({"filename":name,"source_url":u,"result":"HTML","size":len(data),"sha256":hashlib.sha256(data).hexdigest()})
                      continue
                  path=os.path.join(outdir,name)
                  if os.path.exists(path):
                      base,ext=os.path.splitext(name)
                      path=os.path.join(outdir,base+"-alt"+ext)
                  open(path,"wb").write(data)
                  sha=hashlib.sha256(data).hexdigest()
                  rows.append({"filename":name,"source_url":u,"result":"SAVED","size":len(data),"sha256":sha})
                  print("SAVED",name,len(data),sha,u)
                  saved=True
              if not saved:
                  print("NOT_RECOVERED",name)
          with open("fu_7-RECOVERED-CUDY-BETAS-MANIFEST.csv","w",newline="",encoding="utf-8") as f:
              w=csv.DictWriter(f,fieldnames=["filename","source_url","result","size","sha256"]);w.writeheader();w.writerows(rows)
          summary={
              "saved":[r for r in rows if r["result"]=="SAVED"],
              "all_attempts":len(rows)
          }
          open("fu_7-RECOVERED-CUDY-BETAS-SUMMARY.json","w",encoding="utf-8").write(json.dumps(summary,indent=2,ensure_ascii=False))
          print(json.dumps(summary,indent=2,ensure_ascii=False))
          PY

      - name: Pack recovered files
        if: always()
        run: |
          zip -r -9 fu_7-RECOVERED-CUDY-BETAS.zip             fu_7-RECOVERED-CUDY-BETAS             fu_7-RECOVERED-CUDY-BETAS-MANIFEST.csv             fu_7-RECOVERED-CUDY-BETAS-SUMMARY.json || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fu_7-RECOVERED-CUDY-BETAS
          retention-days: 30
          if-no-files-found: warn
          path: |
            fu_7-RECOVERED-CUDY-BETAS.zip
            fu_7-RECOVERED-CUDY-BETAS-MANIFEST.csv
            fu_7-RECOVERED-CUDY-BETAS-SUMMARY.json
