name: FU_7 Recover CudyForum Historical Dev Links
on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - ".github/workflows/fu_7-cudyforum-history-dev-links.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install MEGA downloader
        run: |
          sudo apt-get update
          sudo apt-get install -y megatools

      - name: Recover historical forum MEGA links and download unique files
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import os,re,json,html,time,urllib.parse,urllib.request,csv,hashlib

          UA="Mozilla/5.0 OpenCudy-FU7-History"
          PAGE="https://www.cudyforum.it/d/30-p2-5g-router-wifi-6-ax3000"
          def fetch(u,timeout=90):
            req=urllib.request.Request(u,headers={"User-Agent":UA,"Accept":"*/*"})
            with urllib.request.urlopen(req,timeout=timeout) as r:
              return r.read(),r.status,dict(r.headers)

          params=[
            ("url",PAGE),("output","json"),
            ("fl","timestamp,original,statuscode,digest"),
            ("filter","statuscode:200"),
            ("from","2026"),("to","2026"),
            ("collapse","digest"),
          ]
          cdx="https://web.archive.org/cdx/search/cdx?"+urllib.parse.urlencode(params)
          try:
            b,_,_=fetch(cdx,120); d=json.loads(b.decode("utf-8","replace"))
          except Exception as e:
            print("CDX_FAIL",repr(e));d=[]
          snaps=[]
          if d:
            h=d[0];snaps=[dict(zip(h,r)) for r in d[1:]]
          print("SNAPSHOTS",len(snaps))

          mega_re=re.compile(r'https://mega\.nz/(?:file|folder)/[A-Za-z0-9_-]+#[A-Za-z0-9_-]+')
          fw_re=re.compile(r'(?i)\b(?:P2-)?R91-[A-Za-z0-9_.-]+(?:\.bin|\.zip)?\b')
          found={}
          for s in snaps:
            ts=s.get("timestamp","")
            if not ts:continue
            u=f"https://web.archive.org/web/{ts}id_/{PAGE}"
            try:b,_,_=fetch(u,70)
            except Exception as e:continue
            txt=html.unescape(b.decode("utf-8","replace"))
            links=mega_re.findall(txt)
            markers=sorted(set(fw_re.findall(txt)))
            for link in links:
              # capture context and markers around link
              p=txt.find(link)
              ctx=re.sub(r'<[^>]+>',' ',txt[max(0,p-2500):p+3500])
              ctx=re.sub(r'\s+',' ',ctx).strip()
              near=sorted(set(fw_re.findall(ctx)))
              rec=found.setdefault(link,{"timestamps":[],"near_markers":set(),"contexts":[]})
              rec["timestamps"].append(ts);rec["near_markers"].update(near)
              if len(rec["contexts"])<3:rec["contexts"].append(ctx)
          rows=[]
          for link,r in found.items():
            rows.append({"link":link,"timestamps":"|".join(sorted(set(r["timestamps"]))),"near_markers":" | ".join(sorted(r["near_markers"])),"context":" || ".join(r["contexts"])})
          with open("fu_7-CUDYFORUM-HISTORICAL-MEGA-LINKS.csv","w",newline="",encoding="utf-8") as f:
            w=csv.DictWriter(f,fieldnames=["link","timestamps","near_markers","context"]);w.writeheader();w.writerows(rows)
          json.dump([{**r} for r in rows],open("fu_7-CUDYFORUM-HISTORICAL-MEGA-LINKS.json","w"),indent=2,ensure_ascii=False)
          print(json.dumps([{"link":x["link"],"timestamps":x["timestamps"],"near_markers":x["near_markers"]} for x in rows],indent=2,ensure_ascii=False))
          PY

          mkdir -p fu_7-CUDYFORUM-HISTORICAL-DEV
          python3 - <<'PY' >/tmp/historical_links.txt
          import csv
          for r in csv.DictReader(open("fu_7-CUDYFORUM-HISTORICAL-MEGA-LINKS.csv",encoding="utf-8")):
            print(r["link"])
          PY
          n=0
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            n=$((n+1))
            mkdir -p "fu_7-CUDYFORUM-HISTORICAL-DEV/link-$n"
            echo "DOWNLOADING $n $url"
            megadl --path="fu_7-CUDYFORUM-HISTORICAL-DEV/link-$n" "$url" || true
          done </tmp/historical_links.txt

      - name: Hash recovered files
        shell: bash
        run: |
          python3 - <<'PY'
          import os,hashlib,csv,json
          root="fu_7-CUDYFORUM-HISTORICAL-DEV"
          rows=[]
          for dp,_,fs in os.walk(root):
            for fn in fs:
              p=os.path.join(dp,fn)
              h=hashlib.sha256()
              with open(p,"rb") as f:
                for b in iter(lambda:f.read(1024*1024),b""):h.update(b)
              rows.append({"path":os.path.relpath(p,root),"size":os.path.getsize(p),"sha256":h.hexdigest()})
          rows.sort(key=lambda x:x["path"])
          with open("fu_7-CUDYFORUM-HISTORICAL-DEV-MANIFEST.csv","w",newline="",encoding="utf-8") as f:
            w=csv.DictWriter(f,fieldnames=["path","size","sha256"]);w.writeheader();w.writerows(rows)
          json.dump(rows,open("fu_7-CUDYFORUM-HISTORICAL-DEV-MANIFEST.json","w"),indent=2)
          print(json.dumps(rows,indent=2))
          PY
          zip -r -9 fu_7-CUDYFORUM-HISTORICAL-DEV.zip             fu_7-CUDYFORUM-HISTORICAL-DEV             fu_7-CUDYFORUM-HISTORICAL-DEV-MANIFEST.*             fu_7-CUDYFORUM-HISTORICAL-MEGA-LINKS.* || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fu_7-CUDYFORUM-HISTORICAL-DEV
          retention-days: 30
          if-no-files-found: warn
          path: |
            fu_7-CUDYFORUM-HISTORICAL-DEV.zip
            fu_7-CUDYFORUM-HISTORICAL-DEV-MANIFEST.csv
            fu_7-CUDYFORUM-HISTORICAL-DEV-MANIFEST.json
            fu_7-CUDYFORUM-HISTORICAL-MEGA-LINKS.csv
            fu_7-CUDYFORUM-HISTORICAL-MEGA-LINKS.json
