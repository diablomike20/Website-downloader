name: TEMP Export FU7 Firmware Artifacts

on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - ".github/workflows/TEMP-export-fu7-firmware-artifacts.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fu_7-cudy-cdn-index
          fetch-depth: 0

      - name: Download clean FU7 firmware artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf MIGRATION-STAGING /tmp/fu7-artifacts
          mkdir -p /tmp/fu7-artifacts/{master,openwrt}

          curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPO/actions/artifacts?per_page=100"             -o /tmp/fu7-artifacts/list.json

          python3 - <<'PY' > /tmp/fu7-artifacts/ids.env
          import json
          d=json.load(open("/tmp/fu7-artifacts/list.json"))
          want={
            "MASTER_ID":"fu_7-CUDY-DEV-FIRMWARE-CLEAN-MASTER",
            "OPENWRT_ID":"fu_7-CUDY-OPENWRT-INTERMEDIARY-CLEAN",
          }
          for key,name in want.items():
              hits=[a for a in d.get("artifacts",[]) if a.get("name")==name and not a.get("expired")]
              hits.sort(key=lambda a:a.get("created_at",""),reverse=True)
              if not hits:
                  raise SystemExit(f"artifact not found or expired: {name}")
              a=hits[0]
              print(f"{key}={a['id']}")
              print(f"# {name} id={a['id']} size={a.get('size_in_bytes')} created={a.get('created_at')}")
          PY

          cat /tmp/fu7-artifacts/ids.env
          source <(grep '^[A-Z_]*=' /tmp/fu7-artifacts/ids.env)

          for spec in "master:$MASTER_ID" "openwrt:$OPENWRT_ID"; do
            name="${spec%%:*}"
            id="${spec##*:}"
            echo "DOWNLOADING $name artifact $id"
            curl -fL --retry 2               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$REPO/actions/artifacts/$id/zip"               -o "/tmp/fu7-artifacts/$name.zip"
            ls -lh "/tmp/fu7-artifacts/$name.zip"
          done

          unzip -q /tmp/fu7-artifacts/master.zip -d /tmp/fu7-artifacts/master
          unzip -q /tmp/fu7-artifacts/openwrt.zip -d /tmp/fu7-artifacts/openwrt

      - name: Classify and stage firmware binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, hashlib, os, pathlib, re, shutil, json

          stage=pathlib.Path("MIGRATION-STAGING")
          for d in ("beta","dev-support","recovery-intermediate"):
              (stage/d/"firmware").mkdir(parents=True,exist_ok=True)

          def sha256(p):
              h=hashlib.sha256()
              with open(p,"rb") as f:
                  for b in iter(lambda:f.read(1024*1024),b""):
                      h.update(b)
              return h.hexdigest()

          def find_manifest(root):
              hits=list(pathlib.Path(root).rglob("MANIFEST.csv"))
              return hits[0] if hits else None

          def find_firmware(root,name):
              hits=[p for p in pathlib.Path(root).rglob(name) if p.is_file()]
              return hits[0] if hits else None

          rows_out=[]
          master="/tmp/fu7-artifacts/master"
          man=find_manifest(master)
          if not man:
              raise SystemExit("master MANIFEST.csv not found")
          with open(man,encoding="utf-8-sig",newline="") as f:
              rows=list(csv.DictReader(f))

          for r in rows:
              name=r.get("stored_name","").strip()
              cls=r.get("class","").upper()
              if not name:
                  continue
              p=find_firmware(master,name)
              if not p:
                  print("MISSING",name)
                  continue

              if "RECOVERY" in cls or "INTERMEDIATE" in cls:
                  cat="recovery-intermediate"
              elif "BETA" in cls:
                  cat="beta"
              else:
                  cat="dev-support"

              dst=stage/cat/"firmware"/name
              shutil.copy2(p,dst)
              rows_out.append({
                  "category":cat,
                  "stored_name":name,
                  "size":dst.stat().st_size,
                  "sha256":sha256(dst),
                  "class":r.get("class",""),
                  "source_artifact":r.get("source_artifact",""),
                  "source_artifact_id":r.get("source_artifact_id",""),
                  "source_member_path":r.get("source_member_path",""),
                  "source_url":r.get("source_url",""),
                  "original_name":r.get("original_name",""),
              })

          # OpenWrt/intermediary clean archive is always isolated to recovery-intermediate.
          oman=find_manifest("/tmp/fu7-artifacts/openwrt")
          if oman:
              with open(oman,encoding="utf-8-sig",newline="") as f:
                  orows=list(csv.DictReader(f))
              for r in orows:
                  name=r.get("stored_name","").strip()
                  if not name:
                      continue
                  p=find_firmware("/tmp/fu7-artifacts/openwrt",name)
                  if not p:
                      continue
                  dst=stage/"recovery-intermediate"/"firmware"/name
                  if dst.exists() and sha256(dst)==sha256(p):
                      continue
                  if dst.exists():
                      stem=dst.stem; suf="".join(dst.suffixes)
                      dst=dst.with_name(stem+"-"+sha256(p)[:8]+suf)
                  shutil.copy2(p,dst)
                  rows_out.append({
                      "category":"recovery-intermediate",
                      "stored_name":dst.name,
                      "size":dst.stat().st_size,
                      "sha256":sha256(dst),
                      "class":r.get("class","OPENWRT_INTERMEDIATE"),
                      "source_artifact":r.get("source_artifact",""),
                      "source_artifact_id":r.get("source_artifact_id",""),
                      "source_member_path":r.get("source_member_path",""),
                      "source_url":r.get("source_url",""),
                      "original_name":r.get("original_name",""),
                  })

          fields=["category","stored_name","size","sha256","class","source_artifact","source_artifact_id","source_member_path","source_url","original_name"]
          for cat in ("beta","dev-support","recovery-intermediate"):
              rr=[x for x in rows_out if x["category"]==cat]
              with open(stage/cat/"MANIFEST.csv","w",newline="",encoding="utf-8-sig") as f:
                  w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(rr)
              with open(stage/cat/"SHA256SUMS.txt","w",encoding="utf-8") as f:
                  for x in sorted(rr,key=lambda x:x["stored_name"].lower()):
                      f.write(f'{x["sha256"]}  firmware/{x["stored_name"]}\n')
              print(cat,"files",len(rr),"bytes",sum(x["size"] for x in rr))

          (stage/"SUMMARY.json").write_text(json.dumps({
              "beta_files":sum(1 for x in rows_out if x["category"]=="beta"),
              "dev_support_files":sum(1 for x in rows_out if x["category"]=="dev-support"),
              "recovery_intermediate_files":sum(1 for x in rows_out if x["category"]=="recovery-intermediate"),
              "total_files":len(rows_out)
          },indent=2))
          PY

      - name: Commit temporary migration staging
        shell: bash
        run: |
          set -e
          git config user.name "OpenCudy Migration Bot"
          git config user.email "73985391+diablomike20@users.noreply.github.com"
          git add MIGRATION-STAGING
          git diff --cached --quiet && exit 0
          git commit -m "TEMP: stage FU7 firmware binaries for migration"
          git push origin HEAD:fu_7-cudy-cdn-index
