name: RE Stable MIPS ZeroTier Payload Compare
on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - ".github/workflows/RE-stable-mips-zerotier-payload-compare.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: fu_7-cudy-cdn-index }
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools unzip xz-utils >/dev/null
      - shell: bash
        run: |
          set -euxo pipefail
          rm -rf RE-STABLE-MIPS-ZT-PAYLOAD
          mkdir -p RE-STABLE-MIPS-ZT-PAYLOAD
          python3 - <<'PY'
          import gzip,hashlib,io,json,os,subprocess,tarfile,urllib.request,zipfile
          from pathlib import Path

          out=Path("RE-STABLE-MIPS-ZT-PAYLOAD")
          targets=[
            ("R25-2.4.16","https://www.cudy.com/cdn/shop/files/LT500V2-R25-2.4.16-20250804-150319-flash.zip"),
            ("WR1300-R10-1.13.6","https://www.cudy.com/cdn/shop/files/WR1300-R10-1.13.6-20220314-112409-flash_1.zip"),
            ("M1200-R22-2.0.8","https://www.cudy.com/cdn/shop/files/M1200-R22-2.0.8-20240306-170059-flash.zip"),
            ("M1200-R22-2.4.24","https://www.cudy.com/cdn/shop/files/M1200-R22-2.4.24-20260105-103138-flash.zip"),
            ("TR1200-R46-1.16.3","https://www.cudy.com/cdn/shop/files/TR1200-R46-1.16.3-20230804-164635-flash.zip"),
            ("TR1200-R46-2.5.25","https://www.cudy.com/cdn/shop/files/TR1200-R46-2.5.25-20260805-112208-flash.zip"),
          ]
          names=["zerotier-one","libstdc++.so.6","libminiupnpc.so.17","libnatpmp.so.1"]
          def get(u):
            req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0 OpenCudy-RE","Accept":"*/*"})
            with urllib.request.urlopen(req,timeout=120) as r:return r.read()
          def sha(b):return hashlib.sha256(b).hexdigest()
          def find(root,n):
            hits=list(root.rglob(n))
            if hits:return hits[0]
            pref=n.split(".so")[0]+".so"
            hits=list(root.rglob(pref+"*"))
            return hits[0] if hits else None
          def real(p):
            if p and p.is_symlink():
              q=(p.parent/os.readlink(p)).resolve()
              if q.exists():return q
            return p
          rows=[]
          for idx,(tag,u) in enumerate(targets):
            rec={"tag":tag,"url":u,"status":"UNKNOWN","files":[]}
            try:b=get(u)
            except Exception as e:
              rec["status"]="DOWNLOAD_FAIL";rec["error"]=repr(e);rows.append(rec);continue
            zp=out/f"{idx}.zip";zp.write_bytes(b)
            d=out/f"d{idx}";d.mkdir()
            try:
              with zipfile.ZipFile(zp) as z:z.extractall(d)
            except Exception as e:
              rec["status"]="ZIP_FAIL";rec["error"]=repr(e);rows.append(rec);continue
            fw=next((p for p in d.rglob("*") if p.is_file() and p.suffix.lower()==".bin"),None)
            if not fw:
              rec["status"]="NO_BIN";rows.append(rec);continue
            dat=fw.read_bytes();off=dat.find(b"hsqs")
            if off<0:
              rec["status"]="NO_SQUASHFS";rows.append(rec);continue
            sq=out/f"{idx}.sqfs";sq.write_bytes(dat[off:])
            root=out/f"root{idx}"
            subprocess.run(["unsquashfs","-no-progress","-d",str(root),str(sq)],check=True,
                           stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
            tarbio=io.BytesIO()
            present=[]
            with tarfile.open(fileobj=tarbio,mode="w") as tf:
              for n in names:
                p=real(find(root,n))
                if not p or not p.exists():
                  rec["files"].append({"name":n,"present":False});continue
                bb=p.read_bytes()
                gz=gzip.compress(bb,compresslevel=9,mtime=0)
                xz=subprocess.run(["xz","-9e","-c"],input=bb,stdout=subprocess.PIPE,check=True).stdout
                rec["files"].append({"name":n,"present":True,"real_name":p.name,"size":len(bb),
                                     "sha256":sha(bb),"gzip9":len(gz),"xz9e":len(xz)})
                ti=tarfile.TarInfo(n);ti.size=len(bb);ti.mtime=0;ti.uid=0;ti.gid=0;ti.mode=0o644
                tf.addfile(ti,io.BytesIO(bb));present.append(n)
            tar=tarbio.getvalue()
            rec.update({
              "status":"OK","firmware":fw.name,"firmware_sha256":sha(dat),"squashfs_offset":hex(off),
              "logical_sum":sum(x.get("size",0) for x in rec["files"]),
              "tar_bytes":len(tar),
              "tar_gzip9":len(gzip.compress(tar,compresslevel=9,mtime=0)),
              "tar_xz9e":len(subprocess.run(["xz","-9e","-c"],input=tar,stdout=subprocess.PIPE,check=True).stdout),
              "present":present
            })
            rows.append(rec)
          base=next((x for x in rows if x["tag"]=="R25-2.4.16" and x["status"]=="OK"),None)
          if base:
            for r in rows:
              if r["status"]=="OK":
                r["logical_saving_vs_R25"]=base["logical_sum"]-r["logical_sum"]
                r["gzip_saving_vs_R25"]=base["tar_gzip9"]-r["tar_gzip9"]
                r["xz_saving_vs_R25"]=base["tar_xz9e"]-r["tar_xz9e"]
          (out/"RE-STABLE-MIPS-ZEROTIER-PAYLOAD-COMPARE.json").write_text(json.dumps(rows,indent=2))
          md=["# Stable MIPS ZeroTier payload compare","",
              "Public normal Cudy releases only.","",
              "| Donor | Logical | tar+gzip9 | tar+xz9e | Δ logical vs R25 | Δ gzip vs R25 | ZT SHA | libstdc++ SHA |",
              "|---|---:|---:|---:|---:|---:|---|---|"]
          for r in rows:
            if r["status"]!="OK":
              md.append(f"| {r['tag']} | {r['status']} | | | | | | |");continue
            z=next((x for x in r["files"] if x["name"]=="zerotier-one" and x.get("present")),{})
            c=next((x for x in r["files"] if x["name"]=="libstdc++.so.6" and x.get("present")),{})
            md.append(f"| {r['tag']} | {r['logical_sum']} | {r['tar_gzip9']} | {r['tar_xz9e']} | {r.get('logical_saving_vs_R25','')} | {r.get('gzip_saving_vs_R25','')} | \`{z.get('sha256','')[:16]}…\` | \`{c.get('sha256','')[:16]}…\` |")
          md+=["","## Per-file details"]
          for r in rows:
            md.append(f"### {r['tag']} — {r['status']}")
            for x in r.get("files",[]):
              if not x.get("present"):md.append(f"- {x['name']}: ABSENT")
              else:md.append(f"- {x['name']}: {x['size']} B; gzip9 {x['gzip9']} B; xz9e {x['xz9e']} B; SHA {x['sha256']}")
          (out/"RE-STABLE-MIPS-ZEROTIER-PAYLOAD-COMPARE.md").write_text("\n".join(md)+"\n")
          print("\n".join(md))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RE-STABLE-MIPS-ZEROTIER-PAYLOAD-COMPARE
          retention-days: 30
          path: RE-STABLE-MIPS-ZT-PAYLOAD/RE-STABLE-MIPS-ZEROTIER-PAYLOAD-COMPARE.*
      - shell: bash
        run: |
          mkdir -p RE-STABLE-MIPS-ZT-PAYLOAD-LATEST
          cp RE-STABLE-MIPS-ZT-PAYLOAD/RE-STABLE-MIPS-ZEROTIER-PAYLOAD-COMPARE.* RE-STABLE-MIPS-ZT-PAYLOAD-LATEST/
          git config user.name "OpenCudy RE Bot"
          git config user.email "73985391+diablomike20@users.noreply.github.com"
          git add RE-STABLE-MIPS-ZT-PAYLOAD-LATEST
          git diff --cached --quiet && exit 0
          git commit -m "RE: publish stable MIPS ZeroTier payload comparison"
          git push origin HEAD:fu_7-cudy-cdn-index
