name: fu_8 R25 hcshd static deep RE

on:
  push:
    branches:
      - fu_6-cudy-forensic
    paths:
      - ".github/workflows/fu_8-r25-hcshd-static-deep.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install static RE tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools qemu-user binutils-mipsel-linux-gnu python3 file >/dev/null

      - name: Exact stock extraction and passive hcshd audit
        shell: bash
        run: |
          set -euxo pipefail
          OUT="fu_8-R25-HCSHD-STATIC-DEEP"
          mkdir -p "$OUT/results" "$OUT/work"
          cd "$OUT/work"

          curl -L --fail --retry 3 -o stock.bin "https://d1jvyy13vm72kv.cloudfront.net/device/upgrade/upgrade_LT500V2-R25-2.4.16-20250804-150319-flash_20729.bin"
          echo "57aed945a9f485d178d73a844e420fc2b441e60821e243d3d19d07dd4a3143d6  stock.bin" | sha256sum -c -
          tail -c "+2784590" stock.bin > rootfs.squashfs
          sudo unsquashfs -no-exit-code -d "$PWD/root" rootfs.squashfs >/dev/null 2>&1
          sudo chown -R "$(id -u):$(id -g)" root

          BIN=root/usr/sbin/hcshd
          test -f "$BIN"
          sha256sum "$BIN" > ../results/fu_8-hcshd-sha256.txt
          file "$BIN" > ../results/fu_8-hcshd-file.txt
          mipsel-linux-gnu-readelf -h "$BIN" > ../results/fu_8-hcshd-readelf-header.txt
          mipsel-linux-gnu-readelf -S "$BIN" > ../results/fu_8-hcshd-readelf-sections.txt
          mipsel-linux-gnu-readelf -d "$BIN" > ../results/fu_8-hcshd-readelf-dynamic.txt
          mipsel-linux-gnu-readelf -r "$BIN" > ../results/fu_8-hcshd-readelf-relocs.txt
          mipsel-linux-gnu-readelf -Ws "$BIN" > ../results/fu_8-hcshd-readelf-symbols.txt
          mipsel-linux-gnu-objdump -d -M no-aliases "$BIN" > ../results/fu_8-hcshd-disassembly.txt
          strings -a -t x -n 3 "$BIN" > ../results/fu_8-hcshd-strings-offsets.txt

          for N in 1 127 128 129; do
            set +e
            qemu-mipsel -strace -L "$PWD/root" "$BIN"               > "../results/fu_8-len${N}-stdout.txt"               2> "../results/fu_8-len${N}-stderr.txt" &
            QPID=$!
            sleep 0.5
            N="$N" python3 - <<'PY'
          import os,socket
          n=int(os.environ["N"])
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM)
          s.settimeout(0.6)
          s.sendto(b"\x00"*n,("127.0.0.1",56791))
          try:
              d,_=s.recvfrom(4096)
              open(f"../results/fu_8-len{n}-client.txt","w").write(f"reply_len={len(d)}\n")
          except Exception as e:
              open(f"../results/fu_8-len{n}-client.txt","w").write(f"no_reply={type(e).__name__}\n")
          PY
            sleep 0.4
            kill "$QPID" 2>/dev/null || true
            wait "$QPID" 2>/dev/null
            RC=$?
            echo "daemon_wait_rc=$RC" >> "../results/fu_8-len${N}-client.txt"
            set -e
            grep -aE 'socket\(|bind\(|recvfrom\(|sendto\(|RSA|popen\(|system\(|exit_group'               "../results/fu_8-len${N}-stderr.txt" > "../results/fu_8-len${N}-focused.txt" || true
          done

          python3 - <<'PY'
          from pathlib import Path
          import re,json
          out=Path('../results')
          summary={}
          for n in (1,127,128,129):
              t=(out/f'fu_8-len{n}-stderr.txt').read_text(errors='replace')
              summary[str(n)]={
                  'bind_any_56791': bool(re.search(r'bind\(.*sin_port=htons\(56791\).*0\.0\.0\.0',t)),
                  'recv_len': int(m.group(1)) if (m:=re.search(r'recvfrom\([^\n]*\) = (\d+)',t)) else None,
                  'rsa_decrypt_error': 'RSA decrypt error!' in t,
                  'rsa_key_size_error': 'RSA public key size error!' in t,
                  'sendto_seen': 'sendto(' in t,
                  'system_seen': 'system(' in t,
                  'popen_seen': 'popen(' in t,
                  'exit_seen': 'exit_group(' in t,
              }
          (out/'fu_8-malformed-length-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          PY

          echo "R25_HCSHD_STATIC_DEEP_RE=PASS" > ../results/fu_8-result.txt
          find ../results -type f -print0 | sort -z | xargs -0 sha256sum > ../results/fu_8-results-sha256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fu_8-R25-HCSHD-STATIC-DEEP
          path: fu_8-R25-HCSHD-STATIC-DEEP/results
          compression-level: 6
