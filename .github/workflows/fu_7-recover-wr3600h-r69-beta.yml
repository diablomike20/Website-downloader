name: FU_7 Recover WR3600H R69 Beta

on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - ".github/workflows/fu_7-recover-wr3600h-r69-beta.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Recover exact WR3600H beta from public traces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered evidence
          python3 - <<'PY'
          import os,re,json,hashlib,urllib.parse,urllib.request,time
          UA="Mozilla/5.0 OpenCudy-FU7-R69-Recovery"
          target="R69-2.3.11Beta-20250429-100114-sysupgrade.zip"
          page="https://4pda.to/forum/index.php?showtopic=1103718&st=180"
          candidates=[]; evidence=[]

          def get(url,timeout=45):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"*/*","Accept-Language":"en-US,en;q=0.9"})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.read(),r.status,dict(r.headers)

          def add(u,why):
              if u and u not in [x[0] for x in candidates]:
                  candidates.append((u,why))

          # 1) Direct 4PDA page, several forms.
          for u in [
              page,
              page+"&view=print",
              page+"&output=1",
              "https://4pda.to/forum/lofiversion/index.php?t1103718-180.html",
          ]:
              try:
                  b,st,h=get(u,35)
                  txt=b.decode("utf-8","replace")
                  evidence.append({"source":u,"status":st,"length":len(b),"target_present":target in txt})
                  if target.lower() in txt.lower():
                      i=txt.lower().find(target.lower())
                      frag=txt[max(0,i-6000):i+6000]
                      open("evidence/4pda-fragment.html","w",encoding="utf-8").write(frag)
                      for m in re.finditer(r'href=["\']([^"\']+)["\']',frag,re.I):
                          href=urllib.parse.urljoin(u,m.group(1).replace("&amp;","&"))
                          if target.lower() in href.lower() or "/forum/dl/post/" in href:
                              add(href,"4PDA_PAGE")
                      for m in re.finditer(r'(?i)(https?://[^"\'<>\s]+|/forum/dl/post/\d+/[^"\'<>\s]+)',frag):
                          href=urllib.parse.urljoin(u,m.group(1).replace("&amp;","&"))
                          if target.lower() in href.lower() or "/forum/dl/post/" in href:
                              add(href,"4PDA_PAGE_TEXT")
              except Exception as e:
                  evidence.append({"source":u,"error":repr(e)})

          # 2) Search engine HTML results can expose direct attachment URL.
          q='"'+target+'"'
          for engine in [
              "https://www.google.com/search?q="+urllib.parse.quote(q),
              "https://www.bing.com/search?q="+urllib.parse.quote(q),
              "https://html.duckduckgo.com/html/?q="+urllib.parse.quote(q),
          ]:
              try:
                  b,st,h=get(engine,40); txt=b.decode("utf-8","replace")
                  open("evidence/search-"+str(len(evidence))+".html","w",encoding="utf-8").write(txt)
                  for m in re.finditer(r'https?://[^"\'<>\s&]+',txt,re.I):
                      u=urllib.parse.unquote(m.group(0))
                      if target.lower() in u.lower() or ("4pda" in u.lower() and "/forum/dl/post/" in u.lower()):
                          add(u,"SEARCH_ENGINE")
                  evidence.append({"source":engine,"status":st,"length":len(b)})
              except Exception as e:
                  evidence.append({"source":engine,"error":repr(e)})

          # 3) Wayback page snapshots, parse links from snapshots.
          try:
              params=urllib.parse.urlencode([
                  ("url",page),("output","json"),
                  ("fl","timestamp,original,statuscode,digest"),
                  ("filter","statuscode:200"),("from","2025"),("to","2026")
              ])
              b,_,_=get("https://web.archive.org/cdx/search/cdx?"+params,90)
              data=json.loads(b.decode("utf-8","replace"))
              if data:
                  hdr=data[0]
                  for row in data[1:]:
                      o=dict(zip(hdr,row)); ts=o.get("timestamp","")
                      if not ts: continue
                      snap=f"https://web.archive.org/web/{ts}id_/{page}"
                      try:
                          sb,_,_=get(snap,55); stxt=sb.decode("utf-8","replace")
                          if target.lower() in stxt.lower():
                              i=stxt.lower().find(target.lower())
                              frag=stxt[max(0,i-7000):i+7000]
                              for m in re.finditer(r'href=["\']([^"\']+)["\']',frag,re.I):
                                  href=urllib.parse.urljoin(snap,m.group(1).replace("&amp;","&"))
                                  if target.lower() in href.lower() or "/forum/dl/post/" in href:
                                      add(href,"WAYBACK_PAGE")
                      except Exception:
                          pass
              evidence.append({"source":"wayback-page-cdx","snapshots":max(0,len(data)-1 if data else 0)})
          except Exception as e:
              evidence.append({"source":"wayback-page-cdx","error":repr(e)})

          # 4) Wayback indexed direct attachment URL by target filename.
          for scope in [
              "4pda.to/forum/dl/post/*/"+target,
              "4pda.to/forum/dl/post/*/*",
              "www.cudy.com/*"+target+"*",
              "cdn.shopify.com/*"+target+"*",
          ]:
              try:
                  params=urllib.parse.urlencode([
                      ("url",scope),("output","json"),
                      ("fl","timestamp,original,statuscode,mimetype,digest,length"),
                      ("filter","statuscode:200")
                  ])
                  b,_,_=get("https://web.archive.org/cdx/search/cdx?"+params,90)
                  d=json.loads(b.decode("utf-8","replace"))
                  if d:
                      h=d[0]
                      for rr in d[1:]:
                          o=dict(zip(h,rr)); orig=o.get("original","");ts=o.get("timestamp","")
                          if orig and (target.lower() in orig.lower() or "/forum/dl/post/" in orig.lower()):
                              add(orig,"WAYBACK_CDX_ORIGINAL")
                              if ts:add(f"https://web.archive.org/web/{ts}id_/{orig}","WAYBACK_CDX_SNAPSHOT")
                  evidence.append({"source":"cdx:"+scope,"rows":max(0,len(d)-1 if d else 0)})
              except Exception as e:
                  evidence.append({"source":"cdx:"+scope,"error":repr(e)})

          # Download candidates.
          results=[]
          for idx,(u,why) in enumerate(candidates,1):
              try:
                  data,st,h=get(u,90)
                  sha=hashlib.sha256(data).hexdigest()
                  htmlish=b"<html" in data[:1000].lower() or b"<!doctype" in data[:1000].lower()
                  rec={"url":u,"why":why,"status":st,"size":len(data),"sha256":sha,"htmlish":htmlish}
                  if len(data)>1024*1024 and not htmlish:
                      fn=h.get("Content-Disposition","")
                      out="recovered/"+target
                      if os.path.exists(out):out="recovered/"+sha[:8]+"-"+target
                      open(out,"wb").write(data)
                      rec["saved_as"]=out
                      print("SAVED",out,len(data),sha,u)
                  results.append(rec)
              except Exception as e:
                  results.append({"url":u,"why":why,"error":repr(e)})

          json.dump({"target":target,"candidates":candidates,"results":results,"evidence":evidence},
                    open("fu_7-WR3600H-R69-BETA-RECOVERY.json","w"),indent=2,ensure_ascii=False)
          print(json.dumps({"target":target,"candidate_count":len(candidates),
                            "saved":[x for x in results if x.get("saved_as")]},indent=2))
          PY

      - name: Upload recovery result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fu_7-WR3600H-R69-BETA-RECOVERY
          retention-days: 30
          if-no-files-found: warn
          path: |
            recovered/*
            fu_7-WR3600H-R69-BETA-RECOVERY.json
            evidence/*
