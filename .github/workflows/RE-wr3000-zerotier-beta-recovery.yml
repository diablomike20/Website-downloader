name: RE WR3000 ZeroTier Beta Recovery

on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - ".github/workflows/RE-wr3000-zerotier-beta-recovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fu_7-cudy-cdn-index

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools binutils unzip >/dev/null

      - name: Evidence-derived recovery and static scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p RE-WR3000-ZT-BETA/recovered RE-WR3000-ZT-BETA/evidence RE-WR3000-ZT-BETA/public
          python3 - <<'PY'
          import gzip, hashlib, html, io, json, os, re, subprocess, urllib.parse, urllib.request, zipfile
          from pathlib import Path

          OUT=Path("RE-WR3000-ZT-BETA")
          UA="Mozilla/5.0 OpenCudy-RE-WR3000-ZT-Beta-Recovery/1.0"
          PUBLIC=[
            "https://www.cudy.com/cdn/shop/files/WR3000-R31-2.3.7-20250117-181756-sysupgrade.zip?v=14859092184080051729",
            "https://www.cudy.com/cdn/shop/files/WR3000-R31-2.4.7-20250529-181923-sysupgrade.zip?v=18073092043682477939",
          ]

          def get(url,timeout=90,headers=None):
              h={"User-Agent":UA,"Accept":"*/*"}
              if headers:h.update(headers)
              req=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.read(),r.status,dict(r.headers)

          def sha(data): return hashlib.sha256(data).hexdigest()

          evidence=[]
          candidates=[]

          def add(url,source,context=""):
              url=html.unescape(url).replace("\\u0026","&").rstrip(").,;]}'\"")
              if url.startswith("//"): url="https:"+url
              if not url.startswith("http"): return
              if not any(x["url"]==url for x in candidates):
                  candidates.append({"url":url,"source":source,"context":context[:5000]})

          # 1) Wayback CDX: exact evidence-derived family/version patterns only.
          scopes=[
            "www.cudy.com/cdn/shop/files/*",
            "cdn.shopify.com/s/files/1/0673/4748/0820/files/*",
          ]
          filters=[
            r"original:.*WR3000.*2\\.3\\.7.*",
            r"original:.*WR3000.*[Zz]ero[Tt]ier.*",
            r"original:.*WR3000.*[Bb]eta.*",
          ]
          for scope in scopes:
              for flt in filters:
                  params=[
                    ("url",scope),("output","json"),
                    ("fl","timestamp,original,statuscode,mimetype,digest,length"),
                    ("filter","statuscode:200"),("filter",flt),("collapse","urlkey")
                  ]
                  u="https://web.archive.org/cdx/search/cdx?"+urllib.parse.urlencode(params)
                  try:
                      b,_,_=get(u,120)
                      data=json.loads(b.decode("utf-8","replace"))
                  except Exception as e:
                      evidence.append({"kind":"wayback","scope":scope,"filter":flt,"error":repr(e)})
                      continue
                  rows=[]
                  if data:
                      hdr=data[0]
                      rows=[dict(zip(hdr,x)) for x in data[1:]]
                  evidence.append({"kind":"wayback","scope":scope,"filter":flt,"rows":rows})
                  for r in rows:
                      orig=r.get("original","");ts=r.get("timestamp","")
                      if orig:
                          add(orig,"WAYBACK_ORIGINAL",json.dumps(r))
                          if ts:add(f"https://web.archive.org/web/{ts}id_/{orig}","WAYBACK_ARCHIVE",json.dumps(r))

          # 2) CommonCrawl snapshots of the exact Cudy ZeroTier FAQ around support comments.
          pages=[]
          for n in range(14,22):
              pages += [
                f"https://www.cudy.com/en-gb/blogs/faq/how-to-remote-connect-cudy-router-via-zerotier?page={n}",
                f"https://www.cudy.com/blogs/faq/how-to-remote-connect-cudy-router-via-zerotier?page={n}",
              ]
          try:
              coll=json.loads(get("https://index.commoncrawl.org/collinfo.json",40)[0].decode())
              indexes=[x["id"] for x in coll if x["id"].startswith(("CC-MAIN-2025-","CC-MAIN-2026-"))][:16]
          except Exception as e:
              indexes=[]; evidence.append({"kind":"cc-index","error":repr(e)})

          for page in pages:
              for idx in indexes:
                  q=urllib.parse.urlencode({"url":page,"output":"json"})
                  try:b,_,_=get(f"https://index.commoncrawl.org/{idx}-index?{q}",25)
                  except:continue
                  recs=[]
                  for ln in b.decode("utf-8","replace").splitlines():
                      try:o=json.loads(ln)
                      except:continue
                      if o.get("status")=="200" and all(o.get(k) for k in ("filename","offset","length")):
                          recs.append(o)
                  for ri,o in enumerate(recs):
                      start=int(o["offset"]);end=start+int(o["length"])-1
                      try:rawz,_,_=get("https://data.commoncrawl.org/"+o["filename"],60,{"Range":f"bytes={start}-{end}"})
                      except:continue
                      try:raw=gzip.decompress(rawz)
                      except:
                          try:raw=gzip.GzipFile(fileobj=io.BytesIO(rawz)).read()
                          except:raw=rawz
                      txt=raw.decode("utf-8","replace")
                      low=txt.lower()
                      if not ("wr3000" in low and ("zerotier" in low or "2.3.7" in low)):continue
                      pos=min([p for p in [low.find("2.3.7"),low.find("wr3000"),low.find("zerotier")] if p>=0])
                      frag=txt[max(0,pos-25000):pos+35000]
                      fn=OUT/"evidence"/f"cc-{idx}-{n if 'n' in globals() else 0}-{ri}.html"
                      fn.write_text(frag,encoding="utf-8")
                      evidence.append({"kind":"commoncrawl","index":idx,"page":page,"digest":o.get("digest"),"file":str(fn)})
                      for m in re.finditer(r'(?i)(?:href|src)=["\']([^"\']+)["\']',frag):
                          u=urllib.parse.urljoin(page,m.group(1))
                          ul=u.lower()
                          if ("wr3000" in ul or "drive.google" in ul or "cdn" in ul) and any(k in ul for k in ("firm","beta","2.3.7","zerotier",".bin",".zip","drive.google")):
                              add(u,f"CC:{idx}",frag[max(0,m.start()-1000):m.end()+1500])
                      for m in re.finditer(r'(?i)https?://[^"\'<>\\s]+',frag):
                          u=m.group(0);ul=u.lower()
                          if ("wr3000" in ul or "drive.google" in ul) and any(k in ul for k in ("2.3.7","zerotier","beta",".bin",".zip","drive.google")):
                              add(u,f"CC_RAW:{idx}",frag[max(0,m.start()-1000):m.end()+1500])

          # Include public controls, but keep classification explicit.
          for u in PUBLIC:add(u,"PUBLIC_CONTROL")

          # Expand Drive links.
          for x in list(candidates):
              u=x["url"]
              if "drive.google" in u.lower():
                  m=re.search(r'/file/d/([^/]+)',u) or re.search(r'[?&]id=([^&]+)',u)
                  if m:
                      fid=m.group(1)
                      add(f"https://drive.usercontent.google.com/download?id={fid}&export=download&confirm=t",
                          "DRIVE_DIRECT:"+x["source"],x["context"])

          downloads=[]
          seen=set()
          for x in candidates:
              try:data,st,h=get(x["url"],120)
              except Exception as e:
                  downloads.append({**x,"error":repr(e)});continue
              htmlish=b"<html" in data[:2000].lower() or b"<!doctype" in data[:2000].lower()
              rec={**x,"status":st,"size":len(data),"sha256":sha(data),"content_type":h.get("Content-Type",""),"htmlish":htmlish}
              if len(data)>1_000_000 and not htmlish:
                  if rec["sha256"] in seen:
                      rec["duplicate"]=True
                  else:
                      seen.add(rec["sha256"])
                      cd=h.get("Content-Disposition","")
                      mm=re.search(r'filename\\*?=(?:UTF-8\'\')?["\']?([^;"\']+)',cd,re.I)
                      name=urllib.parse.unquote(mm.group(1).strip()) if mm else ""
                      if not name:name=urllib.parse.unquote(urllib.parse.urlsplit(x["url"]).path.rsplit("/",1)[-1])
                      name=name.split("?")[0]
                      if not name or "." not in name:name="WR3000-support-"+rec["sha256"][:12]+".bin"
                      name=re.sub(r'[^A-Za-z0-9._()+ -]+','_',name)
                      p=OUT/("public" if x["source"]=="PUBLIC_CONTROL" else "recovered")/name
                      p.write_bytes(data);rec["saved_as"]=str(p)
              downloads.append(rec)

          # Extract all downloaded ZIP/BIN firmware and inspect zerotier-one.
          fw=[]
          for d in downloads:
              p=d.get("saved_as")
              if not p:continue
              p=Path(p)
              if zipfile.is_zipfile(p):
                  dest=p.parent/(p.name+".contents");dest.mkdir(exist_ok=True)
                  try:
                      with zipfile.ZipFile(p) as z:z.extractall(dest)
                      for q in dest.rglob("*"):
                          if q.is_file() and q.suffix.lower() in (".bin",".img",".trx",".itb"):fw.append((d,q))
                  except:pass
              elif p.suffix.lower() in (".bin",".img",".trx",".itb"):fw.append((d,p))

          zt=[]
          for i,(meta,p) in enumerate(fw):
              data=p.read_bytes();start=0
              while True:
                  off=data.find(b"hsqs",start)
                  if off<0:break
                  start=off+4
                  sq=OUT/f"tmp-{i}-{off:x}.sqfs";sq.write_bytes(data[off:])
                  root=OUT/f"root-{i}-{off:x}"
                  subprocess.run(["unsquashfs","-no-progress","-d",str(root),str(sq)],
                                 stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  if root.exists():
                      for z in root.rglob("zerotier-one"):
                          if not z.is_file():continue
                          dyn=subprocess.run(["readelf","-d",str(z)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True).stdout
                          need=re.findall(r"Shared library: \\[(.*?)\\]",dyn)
                          zt.append({
                            "source_class":meta["source"],"firmware":p.name,"firmware_sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
                            "zerotier_size":z.stat().st_size,"zerotier_sha256":hashlib.sha256(z.read_bytes()).hexdigest(),
                            "needed":need
                          })
                  try:sq.unlink()
                  except:pass
                  if root.exists():subprocess.run(["rm","-rf",str(root)])

          result={"candidates":candidates,"downloads":downloads,"zerotier":zt,"evidence":evidence}
          (OUT/"RE-WR3000-ZEROTIER-BETA-RECOVERY.json").write_text(json.dumps(result,indent=2,ensure_ascii=False))
          md=["# WR3000 ZeroTier beta recovery","",
              f"Candidate URLs: **{len(candidates)}**",
              f"Downloaded firmware payloads: **{sum(1 for x in downloads if x.get('saved_as'))}**",
              f"ZeroTier runtime occurrences: **{len(zt)}**","",
              "## ZeroTier findings"]
          if zt:
              for x in zt:md.append(f"- {x['firmware']} — {x['zerotier_size']} B — {x['zerotier_sha256']} — NEEDED: {', '.join(x['needed'])}")
          else:md.append("- No zerotier-one executable found in recovered/public-control images.")
          md += ["","## Non-public recovered payloads"]
          for x in downloads:
              if x.get("saved_as") and x["source"]!="PUBLIC_CONTROL":
                  md.append(f"- {x['saved_as']} — {x['size']} B — {x['sha256']} — {x['source']}")
          (OUT/"RE-WR3000-ZEROTIER-BETA-RECOVERY.md").write_text("\n".join(md)+"\n")
          print(json.dumps({"candidate_urls":len(candidates),
                            "saved":sum(1 for x in downloads if x.get("saved_as")),
                            "nonpublic_saved":sum(1 for x in downloads if x.get("saved_as") and x["source"]!="PUBLIC_CONTROL"),
                            "zerotier":zt},indent=2,ensure_ascii=False))
          PY

      - name: Show result
        if: always()
        run: cat RE-WR3000-ZT-BETA/RE-WR3000-ZEROTIER-BETA-RECOVERY.md || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RE-WR3000-ZEROTIER-BETA-RECOVERY
          retention-days: 30
          if-no-files-found: warn
          path: |
            RE-WR3000-ZT-BETA/RE-WR3000-ZEROTIER-BETA-RECOVERY.*
            RE-WR3000-ZT-BETA/recovered/*
            RE-WR3000-ZT-BETA/evidence/*

      - name: Publish small latest result
        if: always()
        shell: bash
        run: |
          set -e
          mkdir -p RE-WR3000-ZEROTIER-BETA-LATEST
          cp RE-WR3000-ZT-BETA/RE-WR3000-ZEROTIER-BETA-RECOVERY.json RE-WR3000-ZEROTIER-BETA-LATEST/ 2>/dev/null || true
          cp RE-WR3000-ZT-BETA/RE-WR3000-ZEROTIER-BETA-RECOVERY.md RE-WR3000-ZEROTIER-BETA-LATEST/ 2>/dev/null || true
          git config user.name "OpenCudy RE Bot"
          git config user.email "73985391+diablomike20@users.noreply.github.com"
          git add RE-WR3000-ZEROTIER-BETA-LATEST
          git diff --cached --quiet && exit 0
          git commit -m "RE: publish WR3000 ZeroTier beta recovery"
          git push origin HEAD:fu_7-cudy-cdn-index
