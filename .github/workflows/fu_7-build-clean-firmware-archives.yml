name: FU_7 Build Clean Firmware Archives

on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - ".github/workflows/fu_7-build-clean-firmware-archives.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Build clean archives from FU_7 artifacts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full >/dev/null

          mkdir -p artifacts master_stage openwrt_stage output

          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          out=[]
          page=1
          while True:
              url=f"https://api.github.com/repos/{repo}/actions/artifacts?per_page=100&page={page}"
              req=urllib.request.Request(url,headers={
                  "Authorization":f"Bearer {token}",
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "User-Agent":"OpenCudy-FU7-Clean-Archive"
              })
              with urllib.request.urlopen(req,timeout=60) as r:
                  d=json.load(r)
              arts=d.get("artifacts",[])
              if not arts: break
              out.extend(arts)
              if len(arts)<100: break
              page+=1
          # latest first, remove expired
          out=[a for a in out if not a.get("expired")]
          out.sort(key=lambda a:a.get("created_at",""),reverse=True)
          json.dump(out,open("artifacts/all.json","w"),indent=2)
          print("ARTIFACTS",len(out))
          PY

          python3 - <<'PY'
          import json, os, re, subprocess
          arts=json.load(open("artifacts/all.json"))
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]

          selected_master=[]
          selected_openwrt=[]
          seen_names=set()

          for a in arts:
              name=a["name"]
              if not name.startswith("fu_7-"):
                  continue
              if any(x in name.upper() for x in ("CLEAN-FIRMWARE","DEV-FIRMWARE-MASTER")):
                  continue
              if "INTERMEDIARY-OPENWRT-FIRMWARE" in name:
                  if not selected_openwrt:
                      selected_openwrt.append(a)
                  continue
              # Download each artifact name only once (latest instance).
              if name in seen_names:
                  continue
              seen_names.add(name)
              selected_master.append(a)

          def dl(a, dest):
              aid=a["id"]; name=a["name"]
              fn=os.path.join(dest,f"{aid}__{re.sub(r'[^A-Za-z0-9._-]+','_',name)}.zip")
              url=f"https://api.github.com/repos/{repo}/actions/artifacts/{aid}/zip"
              subprocess.run([
                  "curl","-L","--fail","--retry","2",
                  "-H",f"Authorization: Bearer {token}",
                  "-H","Accept: application/vnd.github+json",
                  "-H","X-GitHub-Api-Version: 2022-11-28",
                  url,"-o",fn
              ],check=True)
              return fn

          os.makedirs("artifacts/master",exist_ok=True)
          os.makedirs("artifacts/openwrt",exist_ok=True)
          for a in selected_master:
              print("MASTER_DOWNLOAD",a["id"],a["name"])
              dl(a,"artifacts/master")
          for a in selected_openwrt:
              print("OPENWRT_DOWNLOAD",a["id"],a["name"])
              dl(a,"artifacts/openwrt")

          json.dump(selected_master,open("artifacts/master-selected.json","w"),indent=2)
          json.dump(selected_openwrt,open("artifacts/openwrt-selected.json","w"),indent=2)
          print("MASTER_ARTIFACTS",len(selected_master))
          print("OPENWRT_ARTIFACTS",len(selected_openwrt))
          PY

          python3 - <<'PY'
          import csv, hashlib, json, os, re, shutil, subprocess, zipfile, tarfile, gzip
          from pathlib import Path

          BIN_EXT={".bin",".img",".trx",".itb",".ubi",".uimage",".fw",".rom"}

          def safe(s):
              return re.sub(r'[^A-Za-z0-9._()+ -]+','_',s)

          def extract_recursive(archive_dir, stage_dir):
              os.makedirs(stage_dir,exist_ok=True)
              artifact_meta={}
              for outer in sorted(Path(archive_dir).glob("*.zip")):
                  m=re.match(r"(\d+)__(.+)\.zip$",outer.name)
                  aid=m.group(1) if m else ""
                  aname=m.group(2) if m else outer.stem
                  root=Path(stage_dir)/f"{aid}__{aname}"
                  root.mkdir(parents=True,exist_ok=True)
                  try:
                      with zipfile.ZipFile(outer) as z:
                          z.extractall(root)
                  except Exception as e:
                      print("OUTER_FAIL",outer,e); continue
                  artifact_meta[str(root)]=(aid,aname)

              # Recursive nested archive extraction up to 5 passes.
              extracted=set()
              for _ in range(5):
                  todo=[]
                  for p in Path(stage_dir).rglob("*"):
                      if not p.is_file() or str(p) in extracted: continue
                      low=p.name.lower()
                      if low.endswith((".zip",".tar",".tgz",".tar.gz",".7z")):
                          todo.append(p)
                  if not todo: break
                  for p in todo:
                      extracted.add(str(p))
                      dest=p.parent/(p.name+"_contents")
                      if dest.exists(): continue
                      dest.mkdir(parents=True,exist_ok=True)
                      try:
                          low=p.name.lower()
                          if low.endswith(".zip"):
                              with zipfile.ZipFile(p) as z:z.extractall(dest)
                          elif low.endswith((".tar",".tgz",".tar.gz")):
                              with tarfile.open(p) as t:t.extractall(dest)
                          elif low.endswith(".7z"):
                              subprocess.run(["7z","x","-y",f"-o{dest}",str(p)],check=False,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                      except Exception as e:
                          print("NESTED_FAIL",p,e)
              return artifact_meta

          def root_meta(path, stage, meta):
              p=Path(path)
              for parent in [p]+list(p.parents):
                  key=str(parent)
                  if key in meta:return meta[key],str(p.relative_to(parent))
                  if str(parent)==str(Path(stage)):break
              return ("",""),str(p)

          def classify(name,path,artifact,is_openwrt):
              s=(name+" "+path+" "+artifact).lower()
              if is_openwrt:return "OPENWRT_INTERMEDIATE"
              if "cellularupgrade" in s or "rg500" in s or "rm520" in s:return "CELLULAR_DEV_OR_BETA"
              if re.search(r'(^|[^a-z])beta([^a-z]|$)|\d+b(?:-|\.|$)',s):return "BETA"
              if "recovery" in s or "tftp" in s:return "RECOVERY"
              if "intermediate" in s or "middle" in s or "transitional" in s:return "INTERMEDIATE"
              if "sysupgrade" in s:return "SYSUPGRADE_DEV_OR_SUPPORT"
              return "DEV_OR_SUPPORT"

          def text_sources(root):
              texts=[]
              for p in Path(root).rglob("*"):
                  if not p.is_file(): continue
                  if p.suffix.lower() not in (".csv",".json",".txt",".md"):continue
                  try:
                      if p.stat().st_size>5_000_000:continue
                      t=p.read_text("utf-8",errors="ignore")
                      texts.append((p,t))
                  except: pass
              return texts

          url_re=re.compile(r'https?://[^\s"\'<>]+')

          def build(stage, outzip, is_openwrt=False):
              meta=extract_recursive(stage.replace("_stage","_dummy"),stage) if False else None

          def build_from_archives(archive_dir, stage, outzip, is_openwrt):
              meta=extract_recursive(archive_dir,stage)
              texts=text_sources(stage)
              bysha={}
              for p in Path(stage).rglob("*"):
                  if not p.is_file(): continue
                  if p.suffix.lower() not in BIN_EXT: continue
                  low=p.name.lower()
                  # Drop obvious non-firmware backups/dumps unless clearly recovery/boot-related.
                  if "backup" in low and not any(k in low for k in ("recovery","uboot","u-boot","bl2","fip")):
                      continue
                  try:size=p.stat().st_size
                  except:continue
                  if size<131072 and not any(k in low for k in ("recovery","uboot","u-boot","bl2","fip","boot")):
                      continue
                  h=hashlib.sha256()
                  with open(p,"rb") as f:
                      for b in iter(lambda:f.read(1024*1024),b""):h.update(b)
                  sha=h.hexdigest()
                  (aid,artifact),member=root_meta(p,stage,meta)
                  rec=bysha.setdefault(sha,{
                      "sha256":sha,"size":size,"original_names":set(),"classes":set(),
                      "source_artifacts":set(),"source_artifact_ids":set(),"source_member_paths":set(),
                      "source_urls":set(),"source_path":str(p)
                  })
                  rec["original_names"].add(p.name)
                  rec["classes"].add(classify(p.name,member,artifact,is_openwrt))
                  if artifact:rec["source_artifacts"].add(artifact)
                  if aid:rec["source_artifact_ids"].add(aid)
                  rec["source_member_paths"].add(member)

              # Best-effort provenance URLs from discarded manifests/log-like files.
              for rec in bysha.values():
                  names=list(rec["original_names"])
                  for tp,t in texts:
                      for n in names:
                          i=t.lower().find(n.lower())
                          if i<0:continue
                          frag=t[max(0,i-1200):i+2200]
                          for u in url_re.findall(frag):
                              rec["source_urls"].add(u.rstrip(").,;"))
                          if rec["source_urls"]:break
                      if rec["source_urls"]:break

              temp=Path("output/build_openwrt" if is_openwrt else "output/build_master")
              if temp.exists():shutil.rmtree(temp)
              fwdir=temp/"firmware"
              fwdir.mkdir(parents=True)
              used={}
              rows=[]
              for sha,rec in sorted(bysha.items(),key=lambda kv:(sorted(kv[1]["original_names"])[0].lower(),kv[0])):
                  original=sorted(rec["original_names"])[0]
                  stored=safe(original)
                  if stored in used and used[stored]!=sha:
                      stem=Path(stored).stem; suf="".join(Path(stored).suffixes)
                      stored=f"{stem}-{sha[:8]}{suf}"
                  used[stored]=sha
                  shutil.copy2(rec["source_path"],fwdir/stored)
                  rows.append({
                      "stored_name":stored,
                      "original_name":" | ".join(sorted(rec["original_names"])),
                      "size":rec["size"],
                      "sha256":sha,
                      "class":" | ".join(sorted(rec["classes"])),
                      "source_artifact":" | ".join(sorted(rec["source_artifacts"])),
                      "source_artifact_id":" | ".join(sorted(rec["source_artifact_ids"])),
                      "source_member_path":" | ".join(sorted(rec["source_member_paths"])),
                      "source_url":" | ".join(sorted(rec["source_urls"]))
                  })

              manifest=temp/"MANIFEST.csv"
              fields=["stored_name","original_name","size","sha256","class","source_artifact","source_artifact_id","source_member_path","source_url"]
              with open(manifest,"w",newline="",encoding="utf-8-sig") as f:
                  w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(rows)

              shutil.make_archive(outzip[:-4],"zip",temp)
              print(("OPENWRT" if is_openwrt else "MASTER"),"UNIQUE_BINARIES",len(rows))
              for r in rows: print(r["stored_name"],r["size"],r["sha256"],r["class"])

          build_from_archives("artifacts/master","master_stage","output/fu_7-CUDY-DEV-FIRMWARE-CLEAN-MASTER.zip",False)
          build_from_archives("artifacts/openwrt","openwrt_stage","output/fu_7-CUDY-OPENWRT-INTERMEDIARY-CLEAN.zip",True)
          PY

          sha256sum output/*.zip
          ls -lh output/*.zip

      - name: Upload clean firmware archives
        uses: actions/upload-artifact@v4
        with:
          name: fu_7-CUDY-CLEAN-FIRMWARE-ARCHIVES
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            output/fu_7-CUDY-DEV-FIRMWARE-CLEAN-MASTER.zip
            output/fu_7-CUDY-OPENWRT-INTERMEDIARY-CLEAN.zip
