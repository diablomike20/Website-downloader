name: FU_7 Cudy CDN Substring Hunt
on:
  push:
    branches: [fu_7-cudy-cdn-index]
    paths:
      - "scripts/fu_7_cudy_cdn_substring_hunt.py"
      - ".github/workflows/fu_7-cudy-cdn-substring.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Whole-CDN substring hunt
        run: python3 scripts/fu_7_cudy_cdn_substring_hunt.py
      - name: Summary
        if: always()
        run: |
          cat fu_7-CUDY-CDN-SUBSTRING-SUMMARY.json || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fu_7-CUDY-CDN-SUBSTRING-HUNT
          retention-days: 30
          if-no-files-found: warn
          path: |
            fu_7-CUDY-CDN-SUBSTRING-INDEX.csv
            fu_7-CUDY-CDN-R25-SUBSTRING.csv
            fu_7-CUDY-CDN-CSP25-SUBSTRING.csv
            fu_7-CUDY-CDN-R25-CSP25-CROSS.csv
            fu_7-CUDY-CDN-ALL-FLASHZIP.csv
            fu_7-CUDY-CDN-SUBSTRING-SUMMARY.json
